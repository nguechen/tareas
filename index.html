    <input type="checkbox" data-todochk="${it.id}" ${it.done?'checked':''}>
    <input type="text" class="todo-txt" data-todotxt="${it.id}" enterkeyhint="enter" value="${esc(it.text||'')}" placeholder="Pendiente…">
    <button class="xrow" data-tododel="${it.id}" title="Eliminar">✕</button></div>`).join('')}
  <button class="blk-add" data-todoadd>＋ Añadir pendiente</button>`;
 const idx=id=>b.items.findIndex(x=>x.id===id);
 const addAt=pos=>{const it={id:uid('i'),text:'',done:false};b.items.splice(pos,0,it);blkChanged(owner,b,true);focusTodo(it.id);return it;};
 box.querySelector('[data-todoadd]').onclick=()=>addAt(b.items.length);
 box.querySelectorAll('[data-todochk]').forEach(c=>c.onclick=()=>{
  const it=b.items.find(x=>x.id===c.dataset.todochk);if(!it)return;
  it.done=!it.done;blkChanged(owner,b,true);});
 box.querySelectorAll('[data-todotxt]').forEach(i=>{
  const id=i.dataset.todotxt;
  i.onchange=()=>{const it=b.items.find(x=>x.id===id);if(it)it.text=i.value;blkChanged(owner,b,false);};
  i.onkeydown=e=>{
   const it=b.items.find(x=>x.id===id);if(!it)return;
   if(e.key==='Enter'){
    e.preventDefault();
    it.text=i.value;                               // fijar lo escrito antes de actuar
    if(it.text.trim()===''){                       // Enter en vacío: termina la lista
     const p=idx(id);b.items.splice(p,1);blkChanged(owner,b,true);i.blur();return;
    }
    addAt(idx(id)+1);                              // nuevo justo debajo de éste
    return;
   }
   if(e.key==='Backspace'&&i.selectionStart===0&&i.selectionEnd===0&&i.value===''){
    const p=idx(id);
    if(p<=0){e.preventDefault();return;}           // primer ítem vacío: nada que fusionar
    e.preventDefault();
    const prev=b.items[p-1].id;
    b.items.splice(p,1);blkChanged(owner,b,true);
    focusTodo(prev,true);                          // foco al anterior, cursor al final
   }
  };
 });
 box.querySelectorAll('[data-tododel]').forEach(btn=>btn.onclick=()=>{
  b.items=b.items.filter(x=>x.id!==btn.dataset.tododel);blkChanged(owner,b,true);});
}

/* ============================ MARKDOWN ============================
   Renderizador propio, pequeño y seguro. Regla de oro: se escapa TODO el
   texto primero (esc) y sólo después se aplica el Markdown sobre lo ya
   escapado. Así nunca puede colarse HTML del usuario, ni dentro de tablas,
   citas o encabezados. Los enlaces sólo admiten http/https/mailto. */
function safeUrl(u){
 const t=String(u||'').trim().replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"');
 if(/^(https?:|mailto:)/i.test(t))return t;
 if(/^(#|\/|\.\/)/.test(t))return t;
 if(/^[\w.-]+\.[a-z]{2,}([/?#]|$)/i.test(t))return 'https://'+t;   // "ejemplo.com"
 return '';   // javascript:, data:, vbscript:, file:… fuera
}
function mdToHtml(src){
 if(src==null||src==='')return'';
 let s=esc(String(src)).replace(/\r\n?/g,'\n');
 /* 1) apartar el código antes de nada: dentro no se interpreta Markdown */
 const fences=[],inls=[];
 s=s.replace(/```[\w-]*\n?([\s\S]*?)```/g,(m,body)=>{
  fences.push(body.replace(/\n$/,''));return'\u0000F'+(fences.length-1)+'\u0000';});
 s=s.replace(/`([^`\n]+)`/g,(m,c)=>{inls.push(c);return'\u0000I'+(inls.length-1)+'\u0000';});

 const inline=t=>t
  .replace(/\*\*\*(\S(?:[^*]*\S)?)\*\*\*/g,'<strong><em>$1</em></strong>')
  .replace(/\*\*(\S(?:[^*]*\S)?)\*\*/g,'<strong>$1</strong>')
  .replace(/(^|[^\w*])\*(\S(?:[^*\n]*\S)?)\*(?![\w*])/g,'$1<em>$2</em>')
  .replace(/(^|[^\w_])__(\S(?:[^_]*\S)?)__/g,'$1<strong>$2</strong>')
  .replace(/(^|[^\w_])_(\S(?:[^_\n]*\S)?)_(?![\w_])/g,'$1<em>$2</em>')
  .replace(/~~(\S(?:[^~]*\S)?)~~/g,'<del>$1</del>')
  .replace(/\[([^\]]*)\]\(([^)\s]*)\)/g,(m,tx,u)=>{
   const h=safeUrl(u);
   return h?`<a href="${h}" target="_blank" rel="noopener noreferrer">${tx||h}</a>`:tx;});

 const L=s.split('\n'),out=[];let i=0;
 const isUl=l=>/^\s*[-*+]\s+/.test(l),isOl=l=>/^\s*\d+[.)]\s+/.test(l);
 const isFence=l=>/^\u0000F\d+\u0000$/.test(l.trim());
 const isHr=l=>/^(---+|\*\*\*+|___+)\s*$/.test(l.trim());
 const cells=l=>l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(x=>x.trim());
 while(i<L.length){
  const l=L[i];
  if(!l.trim()){i++;continue;}
  let m;
  if(m=/^(#{1,6})\s+(.*)$/.exec(l)){out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);i++;continue;}
  if(isHr(l)){out.push('<hr>');i++;continue;}
  if(isFence(l)){out.push(l.trim());i++;continue;}
  /* tabla: cabecera + línea separadora |---|---| */
  if(/\|/.test(l)&&i+1<L.length&&/\|/.test(L[i+1])&&/^[\s|:-]*-[\s|:-]*$/.test(L[i+1])){
   const head=cells(l);i+=2;const rows=[];
   while(i<L.length&&L[i].trim()&&/\|/.test(L[i])){rows.push(cells(L[i]));i++;}
   out.push('<table class="md-table"><thead><tr>'+head.map(x=>`<th>${inline(x)}</th>`).join('')+
    '</tr></thead><tbody>'+rows.map(r=>'<tr>'+head.map((_,x)=>`<td>${inline(r[x]||'')}</td>`).join('')+'</tr>').join('')+
    '</tbody></table>');continue;}
  /* ojo: esc() ya convirtió '>' en '&gt;', así que la cita se busca así */
  if(/^&gt;\s?/.test(l)){const b=[];
   while(i<L.length&&/^&gt;\s?/.test(L[i])){b.push(L[i].replace(/^&gt;\s?/,''));i++;}
   out.push('<blockquote>'+inline(b.join('<br>'))+'</blockquote>');continue;}
  if(isUl(l)||isOl(l)){const ol=isOl(l),items=[];
   while(i<L.length&&(ol?isOl(L[i]):isUl(L[i]))){
    items.push(L[i].replace(ol?/^\s*\d+[.)]\s+/:/^\s*[-*+]\s+/,''));i++;}
   out.push(`<${ol?'ol':'ul'}>`+items.map(x=>{
    const t=/^\[([ xX])\]\s+/.exec(x);
    return t?`<li class="md-task"><input type="checkbox" disabled ${/x/i.test(t[1])?'checked':''}> ${inline(x.replace(/^\[([ xX])\]\s+/,''))}</li>`
            :`<li>${inline(x)}</li>`;}).join('')+`</${ol?'ol':'ul'}>`);continue;}
  const p=[];
  while(i<L.length&&L[i].trim()&&!isHr(L[i])&&!isFence(L[i])&&
        !/^(#{1,6}\s|&gt;)/.test(L[i])&&!isUl(L[i])&&!isOl(L[i])){p.push(L[i]);i++;}
  if(!p.length){i++;continue;}                    // red de seguridad anti-bucle
  out.push('<p>'+inline(p.join('<br>'))+'</p>');
 }
 return out.join('\n')
  .replace(/\u0000I(\d+)\u0000/g,(m,n)=>'<code>'+inls[+n]+'</code>')
  .replace(/\u0000F(\d+)\u0000/g,(m,n)=>'<pre><code>'+fences[+n]+'</code></pre>');
}
/* ---------- Bloque de texto Markdown (lo usan las notas) ---------- */
function renderMdBlock(box,b,owner){
 const view=()=>{
  box.innerHTML=`<div class="md" data-mdview>${b.text?mdToHtml(b.text)
    :'<span style="color:var(--tx3)">Escribe con Markdown…</span>'}</div>`;
  box.querySelector('[data-mdview]').onclick=e=>{
   if(e.target.tagName==='A')return;              // dejar navegar los enlaces
   if(e.target.type==='checkbox')return;
   edit();};
 };
 const edit=()=>{
  box.innerHTML=`<textarea data-mdedit rows="1">${esc(b.text||'')}</textarea>`;
  const ta=box.querySelector('[data-mdedit]');
  const grow=()=>{ta.style.height='auto';ta.style.height=(ta.scrollHeight||34)+'px';};
  grow();ta.oninput=grow;
  ta.focus();try{const L=ta.value.length;ta.setSelectionRange(L,L);}catch(_){}
  let done=false;
  const commit=ok=>{if(done)return;done=true;
   if(ok&&ta.value!==(b.text||'')){b.text=ta.value;blkChanged(owner,b,false);}
   view();};
  ta.onblur=()=>commit(true);
  ta.onkeydown=e=>{
   if(e.key==='Escape'){e.stopPropagation();commit(false);return;}
   if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();commit(true);}};
 };
 view();
}

/* ============================ NOTAS ============================
   Las notas son "dueños de bloques" igual que las tareas, así que reutilizan
   el motor de la fase 5 sin una sola línea nueva de bloques. Se sincronizan
   con la misma regla que las tareas: gana el updatedAt más reciente y las
   eliminaciones viajan como lápidas (deletedAt). */
let section='tasks',curNote=null,noteQ='';
const note=id=>D.notes.find(n=>n.id===id&&!n.deletedAt);
const liveNotes=()=>D.notes.filter(n=>!n.deletedAt);
function newNote(vals){
 const n=Object.assign({id:uid('n'),title:'',blocks:[newBlock('md')],createdAt:nowISO(),updatedAt:nowISO()},vals||{});
 D.notes.push(n);return n;
}
function delNote(n){n.deletedAt=nowISO();n.updatedAt=nowISO();if(curNote===n.id)curNote=null;}
/* texto plano de una nota: sirve para el buscador y la vista previa */
function noteText(n){
 return [(n.area||'')].concat((n.blocks||[]).map(b=>{
  if(b.type==='md')return b.text||'';
  if(b.type==='todo')return (b.items||[]).map(i=>i.text||'').join(' ');
  if(b.type==='table')return (b.rows||[]).map(r=>Object.values(r.cells||{}).join(' ')).join(' ');
  if(b.type==='db')return (b.rows||[]).map(r=>Object.values(r.v||{}).join(' ')).join(' ');
  return '';})).join(' ').trim();
}
/* Tareas y Notas son dos secciones hermanas, no una ventana sobre la otra. */
function goSection(s,noteId){
 section=s;
 if(s==='notes'){
  if(noteId!==undefined)curNote=noteId;
  if(!curNote){const f=liveNotes()[0];curNote=f?f.id:null;}
  closeDrawer();                       // el panel de tarea sólo vive en Tareas
 }
 $('#tasksPage').hidden=s!=='tasks';
 $('#notesPage').hidden=s!=='notes';
 $('#navTasks').setAttribute('aria-current',s==='tasks'?'page':'false');
 $('#navNotes').setAttribute('aria-current',s==='notes'?'page':'false');
 if(s==='notes')renderNotes();else render();
}
function openNotes(id){goSection('notes',id);}
function closeNotes(){goSection('tasks');}
function renderNotes(){
 if(section!=='notes')return;
 const q=noteQ.toLowerCase();
 const list=liveNotes().filter(n=>!q||(n.title||'').toLowerCase().includes(q)||noteText(n).toLowerCase().includes(q))
   .sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
 /* lista agrupada por área */
 const box=$('#nList');box.innerHTML='';
 if(!list.length){box.innerHTML=`<div class="notes-empty">${noteQ?'Sin resultados':'Aún no hay notas.<br>Crea una con «＋ Nueva nota».'}</div>`;}
 else{
  const collapsed=D.settings.notesCollapsedAreas||[];
  // agrupar
  const byArea={};
  list.forEach(n=>{const a=noteArea(n);(byArea[a]=byArea[a]||[]).push(n);});
  // orden de áreas: alfabético, «Sin área» al final
  const areas=Object.keys(byArea).sort((a,b)=>{
   if(a===NO_AREA)return 1;if(b===NO_AREA)return -1;return a.localeCompare(b);});
  areas.forEach(a=>{
   const grp=document.createElement('div');grp.className='narea-group';
   const isCol=collapsed.includes(a);
   const head=document.createElement('div');head.className='narea-h';head.dataset.area=a;
   head.innerHTML=`<span class="narea-caret">${isCol?'▸':'▾'}</span> ${esc(a)} <span class="narea-n">${byArea[a].length}</span>`;
   head.onclick=()=>{
    const c=D.settings.notesCollapsedAreas||(D.settings.notesCollapsedAreas=[]);
    const i=c.indexOf(a);i>=0?c.splice(i,1):c.push(a);
    D.settings.updatedAt=nowISO();save();renderNotes();};
   grp.appendChild(head);
   if(!isCol)byArea[a].forEach(n=>{
    const el=document.createElement('div');
    el.className='nitem'+(n.id===curNote?' on':'');el.dataset.n=n.id;
    el.innerHTML=`<div class="nt">${esc(n.title)||'Sin título'}</div>
      <div class="np">${esc(noteText(n).slice(0,70))||'Vacía'}</div>`;
    el.onclick=()=>{curNote=n.id;$('#nWrap').classList.add('ed');renderNotes();};
    grp.appendChild(el);
   });
   box.appendChild(grp);
  });
 }
 /* editor */
 const ed=$('#nEdBody');const n=note(curNote);
 if(!n){ed.innerHTML=`<div class="notes-empty">Elige una nota o crea una nueva.</div>`;return;}
 ed.innerHTML=`<div style="display:flex;align-items:center;gap:8px">
   <input id="nTitle" placeholder="Sin título" value="${esc(n.title)}">
   <button class="btn danger" id="nDel" title="Eliminar nota">Eliminar</button></div>
  <div class="narea-row"><span class="narea-lbl">Área</span><button class="narea-pick" id="nArea">🗂 ${esc(noteArea(n))}</button></div>
  <button id="nAddBlock">Añadir elemento</button>
  <div id="nBlocks"></div>`;
 const ti=$('#nTitle');
 ti.onchange=()=>{n.title=ti.value;n.updatedAt=nowISO();save();};
 ti.onkeydown=e=>{if(e.key==='Enter')e.target.blur();};
 $('#nArea').onclick=e=>areaMenu(e.currentTarget,n);
 $('#nDel').onclick=()=>{if(confirm('¿Eliminar esta nota?')){delNote(n);save();}};
 $('#nAddBlock').onclick=e=>blockMenu(e.target,n,['md','table','db','todo']);
 renderBlocks($('#nBlocks'),n);
}
$('#navTasks').onclick=()=>goSection('tasks');
$('#navNotes').onclick=()=>goSection('notes');
$('#nNew').onclick=()=>{const n=newNote();curNote=n.id;$('#nWrap').classList.add('ed');save();
 setTimeout(()=>{const t=$('#nTitle');if(t)t.focus();},60);};
$('#nSearch').oninput=e=>{noteQ=e.target.value.trim();renderNotes();};
$('#nBack').onclick=()=>{$('#nWrap').classList.remove('ed');};

/* ---------- DRAWER ---------- */
function openDrawer(id){openId=id;renderDrawer();$('#drawer').classList.add('open');}
function closeDrawer(){openId=null;$('#drawer').classList.remove('open');}
function renderDrawer(){
 const t=task(openId);if(!t){closeDrawer();return;}
 $('#dTitle').value=t.v.name||'';
 $('#dDone').textContent=isDone(t)?'↩ Reabrir':'✓ Completar';
 const box=$('#dProps');box.innerHTML='';
 drawerProps(t).forEach(p=>{
  const row=document.createElement('div');row.className='dprop';
  row.innerHTML=`<div class="dlab" title="${esc(p.name)}"><span>${TYPES[p.type].ic}</span>${esc(p.name)}</div><div class="dval">${cellHTML(t,p,'drawer')}</div>`;
  row.querySelector('.dlab').onclick=e=>{e.stopPropagation();propEditor(p);};
  const c=row.querySelector('[data-cell]');
  if(c)c.onclick=e=>{
   if(e.target.tagName==='A')return;
   const op=e.target.closest('[data-nopen]');
   if(op){e.stopPropagation();openNotes(op.dataset.nopen);return;}
   editCell(c,t,p);};
  box.appendChild(row);
 });
 renderBlocks($('#dBlocks'),t);
}
$('#dClose').onclick=closeDrawer;
$('#dTitle').onchange=()=>{const t=task(openId);if(t)setVal(t,'name',$('#dTitle').value);};
$('#dTitle').onkeydown=e=>{if(e.key==='Enter')e.target.blur();};
$('#dDone').onclick=()=>{const t=task(openId);if(t)toggleDone(t);};
$('#dDel').onclick=()=>{const t=task(openId);if(t&&confirm('¿Eliminar esta tarea?')){delTask(t);save();}};
$('#dAddProp').onclick=e=>{const t=task(openId);if(t)addShowPropMenu(e.target,t);};
$('#dAddBlock').onclick=e=>{const t=task(openId);if(t)blockMenu(e.target,t);};
</script>
<script>
'use strict';
/* ============================ FILTROS / ORDEN / GRUPO ============================ */
const OPS={eq:'es',neq:'no es',contains:'contiene',empty:'está vacío',nempty:'no está vacío',gt:'mayor / después',lt:'menor / antes',today:'es hoy',overdue:'vencida'};
function opsFor(p){
 if(['select','multi','status','person'].includes(p.type))return['eq','neq','empty','nempty'];
 if(p.type==='date')return['eq','gt','lt','today','overdue','empty','nempty'];
 if(p.type==='number')return['eq','neq','gt','lt','empty','nempty'];
 if(p.type==='checkbox')return['eq'];
 return['contains','eq','neq','empty','nempty'];
}
$('#pFilter').onclick=e=>{
 const v=view(cur);
 const row=(f,i)=>{
  const p=prop(f.prop)||D.props[0];
  const needVal=!['empty','nempty','today','overdue'].includes(f.op);
  let valIn='';
  if(needVal){
   if(p.options&&p.options.length)valIn=`<select data-fv="${i}"><option value=""></option>${p.options.map(o=>`<option ${f.value===o.name?'selected':''}>${esc(o.name)}</option>`).join('')}</select>`;
   else if(p.type==='date')valIn=`<input type="date" data-fv="${i}" value="${esc(dOnly(f.value))}">`;
   else if(p.type==='checkbox')valIn=`<select data-fv="${i}"><option value="true" ${String(f.value)==='true'?'selected':''}>✓</option><option value="false" ${String(f.value)==='false'?'selected':''}>✗</option></select>`;
   else valIn=`<input data-fv="${i}" value="${esc(f.value||'')}" style="width:110px">`;
  }
  return`<div class="mi" style="cursor:default;flex-wrap:wrap">
   <select data-fp="${i}">${D.props.map(pp=>`<option value="${pp.id}" ${f.prop===pp.id?'selected':''}>${esc(pp.name)}</option>`).join('')}</select>
   <select data-fo="${i}">${opsFor(p).map(o=>`<option value="${o}" ${f.op===o?'selected':''}>${OPS[o]}</option>`).join('')}</select>
   ${valIn}<button data-fx="${i}">✕</button></div>`;};
 openPop(`
  <div class="mhead">Coincidencia</div>
  <div class="mi" style="cursor:default;gap:6px">
   <button class="btn ${v.filterJoin!=='or'?'primary':''}" id="fJoinAnd" style="font-size:12px;padding:2px 9px">Todos (Y)</button>
   <button class="btn ${v.filterJoin==='or'?'primary':''}" id="fJoinOr" style="font-size:12px;padding:2px 9px">Cualquiera (O)</button>
  </div>
  <div class="mhead">Filtros${v.filterJoin==='or'?' · se cumple al menos uno':' · se cumplen todos'}</div>
  ${v.filters.map(row).join('')||'<div class="mi" style="color:var(--tx3);cursor:default">Sin filtros</div>'}
  <div class="msep"></div>
  <button class="mi" id="fAdd"><span class="mic">＋</span>Agregar filtro</button>
  <button class="mi" id="fPreset"><span class="mic">⚡</span>Preset: Hoy + Vencidas (O)</button>
  ${v.filters.length?'<button class="mi" id="fClear"><span class="mic">✕</span>Quitar todos</button>':''}
 `,e.target,pp=>{
  const upd=()=>{v.updatedAt=nowISO();save({noRender:false});closePop();$('#pFilter').click();};
  const jA=pp.querySelector('#fJoinAnd'),jO=pp.querySelector('#fJoinOr');
  if(jA)jA.onclick=()=>{v.filterJoin='and';upd();};
  if(jO)jO.onclick=()=>{v.filterJoin='or';upd();};
  pp.querySelectorAll('[data-fp]').forEach(s=>s.onchange=()=>{const f=v.filters[+s.dataset.fp];f.prop=s.value;f.op=opsFor(prop(s.value))[0];f.value='';upd();});
  pp.querySelectorAll('[data-fo]').forEach(s=>s.onchange=()=>{v.filters[+s.dataset.fo].op=s.value;upd();});
  pp.querySelectorAll('[data-fv]').forEach(s=>s.onchange=()=>{v.filters[+s.dataset.fv].value=s.value;v.updatedAt=nowISO();save();});
  pp.querySelectorAll('[data-fx]').forEach(b=>b.onclick=()=>{v.filters.splice(+b.dataset.fx,1);upd();});
  pp.querySelector('#fAdd').onclick=()=>{v.filters.push({prop:'status',op:'eq',value:''});upd();};
  const fpre=pp.querySelector('#fPreset');
  if(fpre)fpre.onclick=()=>{v.filterJoin='or';
   v.filters=[{prop:'date',op:'today',value:''},{prop:'date',op:'overdue',value:''}];upd();};
  const fc=pp.querySelector('#fClear');if(fc)fc.onclick=()=>{v.filters=[];v.updatedAt=nowISO();save();closePop();};
 });
};
$('#pSort').onclick=e=>{
 const v=view(cur);
 openPop(`
  ${D.props.map(p=>`<button class="mi ${v.sort&&v.sort.prop===p.id?'sel':''}" data-s="${p.id}"><span class="mic">${TYPES[p.type].ic}</span>${esc(p.name)}</button>`).join('')}
  <div class="msep"></div>
  <button class="mi" data-dir><span class="mic">↕</span>Dirección: ${v.sort&&v.sort.dir<0?'descendente':'ascendente'}</button>
  <button class="mi" data-clr><span class="mic">✕</span>Sin orden</button>
 `,e.target,pp=>{
  pp.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{v.sort={prop:b.dataset.s,dir:(v.sort&&v.sort.dir)||1};v.updatedAt=nowISO();save();closePop();});
  pp.querySelector('[data-dir]').onclick=()=>{if(v.sort)v.sort.dir=-(v.sort.dir||1);v.updatedAt=nowISO();save();closePop();};
  pp.querySelector('[data-clr]').onclick=()=>{v.sort=null;v.updatedAt=nowISO();save();closePop();};
 });
};
$('#pGroup').onclick=e=>{
 const v=view(cur);
 const groupable=D.props.filter(p=>['select','multi','status','date','person','checkbox','text'].includes(p.type));
 openPop(`
  <button class="mi ${!v.group?'sel':''}" data-g=""><span class="mic">✕</span>Sin agrupar</button>
  ${groupable.map(p=>`<button class="mi ${v.group===p.id?'sel':''}" data-g="${p.id}"><span class="mic">${TYPES[p.type].ic}</span>${esc(p.name)}</button>`).join('')}
 `,e.target,pp=>pp.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{v.group=b.dataset.g||null;v.updatedAt=nowISO();save();closePop();}));
};
$('#pProps').onclick=e=>{
 const v=view(cur);
 const inView=v.cols.map(prop).filter(Boolean),rest=D.props.filter(p=>!v.cols.includes(p.id));
 openPop(`
  <div class="mhead">Visibles en esta vista (arrastra para ordenar)</div>
  ${inView.map(p=>`<div class="mi listrow" draggable="true" data-vc="${p.id}"><span class="grab">⋮⋮</span><span class="mic">${TYPES[p.type].ic}</span><span class="nm">${esc(p.name)}</span>${p.id==='name'?'':`<button class="eye" data-off="${p.id}" title="Ocultar">👁</button>`}</div>`).join('')}
  <div class="mhead">Ocultas</div>
  ${rest.map(p=>`<div class="mi listrow"><span class="mic">${TYPES[p.type].ic}</span><span class="nm">${esc(p.name)}</span><button class="eye off" data-on="${p.id}" title="Mostrar">👁</button></div>`).join('')||'<div class="mi" style="color:var(--tx3);cursor:default">—</div>'}

/* ============================ IMPORTAR ============================ */
function pickFile(accept,cb){const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>i.files[0]&&cb(i.files[0]);i.click();}
const MESES={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,octubre:10,noviembre:11,diciembre:12};
function parseAnyDate(s){
 if(!s)return'';s=String(s).trim();
 if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,16).replace(' ','T');
 let m=s.match(/^(\d{1,2}) de ([a-záéíóúñ]+) de (\d{4})(?:\s+(\d{1,2}):(\d{2}))?/i);
 if(m){const mes=MESES[m[2].toLowerCase()];if(mes){let r=m[3]+'-'+String(mes).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  if(m[4])r+='T'+String(m[4]).padStart(2,'0')+':'+m[5];return r;}}
 m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
 if(m){let y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');}
 const d=new Date(s);return isNaN(d)?'':d.toISOString().slice(0,10);
}
function parseCSV(text){
 const rows=[];let row=[],cell='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
  else if(c==='"')q=true;
  else if(c===','){row.push(cell);cell='';}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';
   if(row.length>1||row[0]!=='')rows.push(row);row=[];}
  else cell+=c;}
 if(cell!==''||row.length){row.push(cell);rows.push(row);}
 return rows;
}

async function handleImportFile(f){
 try{
  let rows=null;
  if(/\.json$/i.test(f.name)){
   const j=JSON.parse(await f.text());
   if(j&&j.format==='tareas-app'&&Array.isArray(j.tasks)){ // respaldo propio
    const r=importBackup(j);
    $('#mImport').classList.remove('show');
    toast(r.tasks+' tareas y '+r.notes+' notas importadas del respaldo');return;}
   const arr=Array.isArray(j)?j:(j.tasks||[]);
   if(!arr.length)return toast('El JSON no contiene tareas');
   const keys=[...new Set(arr.flatMap(o=>Object.keys(o)))];
   rows=[keys,...arr.map(o=>keys.map(k=>{const v=o[k];return Array.isArray(v)?v.join(', '):(v==null?'':(typeof v==='object'?JSON.stringify(v):v));}))];
  }else if(/\.xlsx$/i.test(f.name)){
   if(!window.XLSX){toast('Descargando lector de Excel…');
    await new Promise((res,rej)=>{const s=document.createElement('script');
     s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);})
    .catch(()=>{throw new Error('Sin conexión: guarda el Excel como CSV e inténtalo de nuevo.');});}
   const wb=XLSX.read(await f.arrayBuffer());
   rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false});
  }else{
   let txt=await f.text();if(txt.charCodeAt(0)===0xFEFF)txt=txt.slice(1);
   if(/\.tsv$/i.test(f.name))rows=txt.split(/\r?\n/).filter(Boolean).map(l=>l.split('\t'));
   else rows=parseCSV(txt);
  }
  if(!rows||rows.length<2)return toast('El archivo no tiene filas de datos');
  showMapping(rows);
 }catch(err){toast('Error: '+err.message);}
}
/* Restaurar un respaldo propio. Reutiliza mergeDocs, es decir EXACTAMENTE las
   mismas reglas que la sincronización: mismo id = gana la versión más reciente,
   nada se duplica, y se restauran también vistas, propiedades y configuración
   (el JSON se anuncia como «respaldo completo», así que debe serlo). */
function importBackup(j){
 const t0=D.tasks.length,n0=D.notes.length;
 mergeDocs(j);
 applyTheme();save();
 return {tasks:D.tasks.length-t0,notes:D.notes.length-n0};
}
function mergeProps(remote){
 remote.forEach(rp=>{const lp=prop(rp.id);
  if(!lp)D.props.push(rp);
  else if(isNewer(rp.updatedAt,lp.updatedAt))Object.assign(lp,rp);});
}
function guessProp(h){
 const n=h.toLowerCase().trim();
 const map={nombre:'name',name:'name',título:'name',titulo:'name',tarea:'name',
  fecha:'date',date:'date',vencimiento:'date','due date':'date','fecha límite':'date',
  status:'status',estado:'status','etapa de tarea':'status',
  descripción:'desc',descripcion:'desc',description:'desc',
  prioridad:'prio',priority:'prio',contexto:'ctx',context:'ctx',
  etiquetas:'tags',tags:'tags','multi-select':'tags',área:'area',area:'area',
  energía:'energy',energia:'energy',proyecto:'project',project:'project',
  url:'url',correo:'email',email:'email',teléfono:'phone',telefono:'phone',
  asignado:'who','delegada a':'who',persona:'who',notas:'notes',notes:'notes',
  creado:'created',created:'created',editado:'edited',edited:'edited'};
 if(map[n])return map[n];
 const p=D.props.find(x=>x.name.toLowerCase()===n);return p?p.id:'';
}
function showMapping(rows){
 const headers=rows[0].map(h=>String(h||'').trim());
 impData={headers,rows:rows.slice(1)};
 $('#impMap').innerHTML=`
  <p class="help" style="margin:12px 0 8px"><b>${impData.rows.length}</b> filas detectadas. Asigna cada columna:</p>
  <table class="maptable"><tr><th>Columna del archivo</th><th>Ejemplo</th><th>Propiedad destino</th></tr>
  ${headers.map((h,i)=>`<tr><td><b>${esc(h)||'(col '+(i+1)+')'}</b></td>
    <td style="color:var(--tx2);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(impData.rows[0]&&impData.rows[0][i]||'')}</td>
    <td><select data-map="${i}">
     <option value="">— Ignorar —</option>
     ${D.props.map(p=>`<option value="${p.id}" ${guessProp(h)===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
     <option value="__new_text">Crear nueva (Texto)</option>
     <option value="__new_select">Crear nueva (Selección)</option>
     <option value="__new_multi">Crear nueva (Sel. múltiple)</option>
     <option value="__new_number">Crear nueva (Número)</option>
     <option value="__new_date">Crear nueva (Fecha)</option>
    </select></td></tr>`).join('')}</table>`;
 $('#impGo').style.display='';
 $('#impGo').onclick=runImport;
}
function runImport(){
 const maps=$$('#impMap [data-map]').map(s=>s.value);
 const{headers,rows}=impData;let n=0;
 const colProp=maps.map((m,i)=>{
  if(!m)return null;
  if(m.startsWith('__new_')){
   const type=m.slice(6);
   const p={id:uid('p'),name:headers[i]||'Columna '+(i+1),type,updatedAt:nowISO()};
   if(['select','multi'].includes(type))p.options=[];
   D.props.push(p);return p;}
  return prop(m);});
 rows.forEach(r=>{
  if(!r.some(c=>String(c||'').trim()))return;
  const t=newTask({});delete t.v.status;
  r.forEach((c,i)=>{const p=colProp[i];if(!p)return;let v=String(c??'').trim();if(!v)return;
   if(p.type==='date'||p.type==='created'||p.type==='edited'){v=parseAnyDate(v);if(!v)return;
    if(p.type==='created'){t.createdAt=v;return;}if(p.type==='edited'){t.updatedAt=v;return;}}
   if(p.type==='multi'){const arr=v.split(',').map(x=>x.trim()).filter(Boolean);arr.forEach(x=>ensureOption(p,x));t.v[p.id]=arr;return;}
   if(['select','status'].includes(p.type))ensureOption(p,v);
   if(p.type==='number'){const num=parseFloat(v.replace(',','.'));if(isNaN(num))return;v=num;}
   if(p.type==='checkbox')v=/^(true|sí|si|yes|1|✓)$/i.test(v);
   t.v[p.id]=v;});
  if(!t.v.status)t.v.status='Inbox';
  if(!t.v.name)t.v.name=r.find(c=>String(c||'').trim())||'Sin título';
  n++;});
 collectOptions();save();$('#mImport').classList.remove('show');
 toast(n+' tareas importadas');
}
function collectOptions(){ /* añade opciones faltantes según valores existentes */
 D.props.filter(p=>['select','status','multi'].includes(p.type)).forEach(p=>{
  liveTasks().forEach(t=>{const v=t.v[p.id];if(!v)return;
   (Array.isArray(v)?v:[v]).forEach(x=>ensureOption(p,x));});});
}

const SCOPE_DRIVE='https://www.googleapis.com/auth/drive.appdata';
const SCOPE_CAL='https://www.googleapis.com/auth/calendar.events';
/* alcance de permisos que pedimos según lo que esté activado */
function gScopes(){
 const s=[];
 if(M.driveOn)s.push(SCOPE_DRIVE);
 if(D.settings.calSync)s.push(SCOPE_CAL);
 if(!s.length)s.push(SCOPE_DRIVE);
 return s.join(' ');
}
function loadGSI(){return new Promise((res,rej)=>{
 if(window.google&&google.accounts)return res();
 const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';
 s.onload=res;s.onerror=()=>rej(new Error('Sin conexión con Google'));document.head.appendChild(s);});}
async function driveConnect(interactive){
 const cid=D.settings.clientId;
 if(!cid)return toast('Primero pega tu ID de cliente de Google (ver INSTRUCCIONES.md)');
 try{
  await loadGSI();
  tokenClient=google.accounts.oauth2.initTokenClient({client_id:cid,
   scope:gScopes(),
   callback:resp=>{
    if(resp.error){M.lastError='Autorización rechazada';syncUI();return;}
    accessToken=resp.access_token;M.driveOn=true;M.lastError=null;persist();syncUI();
    syncNow();toast('Google Drive conectado');
    if(D.settings.calSync)pushCalendar(false);
    const st=$('#stSyncInfo');if(st)openSettings();
   }});
  tokenClient.requestAccessToken({prompt:interactive?'consent':''});
 }catch(err){M.lastError=err.message;syncUI();toast(err.message);}
}
/* Autoriza / activa la sincronización con Google Calendar (una vía) */
async function calConnect(interactive){
 const cid=D.settings.clientId;
 if(!cid)return toast('Primero pega tu ID de cliente de Google (ver INSTRUCCIONES.md)');
 D.settings.calSync=true;D.settings.updatedAt=nowISO();persist();
 try{
  await loadGSI();
  tokenClient=google.accounts.oauth2.initTokenClient({client_id:cid,
   scope:gScopes(),
   callback:resp=>{
    if(resp.error){D.settings.calSync=false;M.lastError='Autorización de Calendar rechazada';syncUI();
     if($('#settingsBody'))openSettings();return;}
    accessToken=resp.access_token;M.lastError=null;persist();
    toast('Google Calendar conectado');
    pushCalendar(true);
    if($('#settingsBody'))openSettings();
   }});
  tokenClient.requestAccessToken({prompt:interactive?'consent':''});
 }catch(err){M.lastError=err.message;toast(err.message);}
}
async function ensureToken(){
 if(accessToken)return true;
 if((!M.driveOn&&!D.settings.calSync)||!D.settings.clientId)return false;
 try{await loadGSI();
  return await new Promise(res=>{
   tokenClient=google.accounts.oauth2.initTokenClient({client_id:D.settings.clientId,
    scope:gScopes(),
    callback:r=>{if(r.access_token){accessToken=r.access_token;res(true);}else res(false);}});
   tokenClient.requestAccessToken({prompt:''});
   setTimeout(()=>res(!!accessToken),8000);});
 }catch(_){return false;}
}
async function dFetch(url,opts){
 opts=opts||{};opts.headers=Object.assign({Authorization:'Bearer '+accessToken},opts.headers||{});
 const r=await fetch(url,opts);
 if(r.status===401){accessToken=null;throw new Error('401 · sesión de Google caducada (reconecta)');}
 if(!r.ok){let detail='';
  try{const j=await r.clone().json();detail=(j.error&&(j.error.message||j.error.status))||'';}catch(_){}
  throw new Error('Google '+r.status+(detail?' · '+detail:''));}
 return r;
}
async function findRemote(){
 if(M.driveFileId)return M.driveFileId;
 const r=await dFetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name)&q='+encodeURIComponent(`name='${DRIVE_FILE}'`));
 const j=await r.json();
 if(j.files&&j.files.length){M.driveFileId=j.files[0].id;return M.driveFileId;}
 const c=await dFetch('https://www.googleapis.com/drive/v3/files',{method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({name:DRIVE_FILE,parents:['appDataFolder']})});
 M.driveFileId=(await c.json()).id;return M.driveFileId;
}
function mergeDocs(remote){
 if(!remote||remote.format!=='tareas-app')return;
 // tareas: gana la más reciente por updatedAt (incluye tombstones deletedAt)
 (remote.tasks||[]).forEach(rt=>{
  const lt=D.tasks.find(t=>t.id===rt.id);
  if(!lt)D.tasks.push(rt);
  else if(isNewer(rt.updatedAt,lt.updatedAt))Object.assign(lt,rt);});
 /* notas: misma regla que las tareas (gana el updatedAt mayor, las lápidas viajan) */
 (remote.notes||[]).forEach(rn=>{
  const ln=D.notes.find(n=>n.id===rn.id);
  if(!ln)D.notes.push(rn);
  else if(isNewer(rn.updatedAt,ln.updatedAt))Object.assign(ln,rn);});
 if(remote.props)mergeProps(remote.props);
 (remote.views||[]).forEach(rv=>{
  const lv=view(rv.id);
  if(!lv)D.views.push(rv);
  else if(isNewer(rv.updatedAt,lv.updatedAt)){const i=D.views.indexOf(lv);D.views[i]=rv;}});
 if(remote.settings&&isNewer(remote.settings.updatedAt,D.settings.updatedAt)){
  const cid=D.settings.clientId;D.settings=remote.settings;if(!D.settings.clientId)D.settings.clientId=cid;}
 // purgar tombstones de más de 60 días
 const cut=addDays(todayStr(),-60);
 D.tasks=D.tasks.filter(t=>!t.deletedAt||dOnly(t.deletedAt)>cut);
 D.notes=D.notes.filter(n=>!n.deletedAt||dOnly(n.deletedAt)>cut);
 collectOptions();
}
async function syncNow(manual){
 if(syncing)return;
 if(!M.driveOn){if(manual)toast('Conecta Google Drive en Configuración');return;}
 if(!navigator.onLine){if(manual)toast('Sin conexión: se sincronizará al volver internet');syncUI();return;}
 syncing=true;syncUI();
 try{
  if(!await ensureToken())throw new Error('No se pudo autorizar con Google');
  const id=await findRemote();
  const before=M.pending;
  let remote=null;
  try{remote=await(await dFetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media')).json();}catch(_){/* archivo vacío */}
  mergeDocs(remote);
  const payload={format:'tareas-app',version:1,savedAt:nowISO(),props:D.props,views:D.views,settings:D.settings,tasks:D.tasks,notes:D.notes};
  await dFetch('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media',{
   method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  M.pending=Math.max(0,M.pending-before);M.lastSync=nowISO();M.lastError=null;
  applyTheme();persist();render();
  if(manual)toast('Sincronizado ✓');
 }catch(err){M.lastError=err.message;persist();if(manual)toast('Error de sincronización: '+err.message);}
 syncing=false;syncUI();
}
/* ============================ SINCRONIZACIÓN CON GOOGLE CALENDAR (una vía) ============================ */
let calPushing=false,calT=null;
/* firma para detectar si una tarea cambió respecto a su evento */
function calSig(t){return [t.v.name,t.v.date,t.v.desc,t.v.status,isDone(t)?1:0].join('||');}
/* fecha-hora local en formato RFC3339 con offset (p. ej. 2026-07-15T14:30:00-04:00) */
function isoLocal(d){
 const p=n=>String(n).padStart(2,'0');
 const off=-d.getTimezoneOffset(),sg=off>=0?'+':'-',a=Math.abs(off);
 return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())+':00'+sg+p(Math.floor(a/60))+':'+p(a%60);
}
function calEventBody(t){
 const parts=[];
 if(t.v.desc)parts.push(t.v.desc);
 if(t.v.status)parts.push('Estado: '+t.v.status);
 if(t.v.prio)parts.push('Prioridad: '+t.v.prio);
 if(t.v.ctx)parts.push('Contexto: '+t.v.ctx);
 parts.push('— Creado desde la app Tareas');
 const body={summary:(isDone(t)?'✓ ':'')+(t.v.name||'Sin título'),description:parts.join('\n')};
 const dv=t.v.date;
 /* IMPORTANTE: un EventDateTime no puede llevar `date` y `dateTime` a la vez.
    Enviamos null en la variante que no toca para que Google la borre; si no,
    una tarea que nació sin hora se quedaría para siempre como "todo el día". */
 let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';}catch(_){}
 if(dv.length>10){
  const mins=+D.settings.calDurationMin||60;
  const s=new Date(dv),e=new Date(s.getTime()+mins*60000);
  body.start={dateTime:isoLocal(s),date:null};
  body.end  ={dateTime:isoLocal(e),date:null};
  if(tz){body.start.timeZone=tz;body.end.timeZone=tz;}
 }else{
  body.start={date:dv,            dateTime:null};
  body.end  ={date:addDays(dv,1), dateTime:null};
 }
 return body;
}
const CAL_BASE=()=>'https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(D.settings.calId||'primary')+'/events';
async function calUpsert(t){
 const body=JSON.stringify(calEventBody(t));
 const opt={headers:{'Content-Type':'application/json'},body};
 if(t.gcalId){
  /* PUT (reemplazo total) en vez de PATCH: el PATCH de Google fusiona los objetos
     start/end, así que al pasar de "todo el día" a evento con hora quedaban `date`
     y `dateTime` juntos y la API rechazaba TODA la petición (ni hora ni descripción). */
  try{await dFetch(CAL_BASE()+'/'+t.gcalId,Object.assign({method:'PUT'},opt));return;}
  catch(err){if(!/\b(404|410)\b/.test(err.message))throw err;/* evento borrado a mano → recrear */}
 }
 const r=await dFetch(CAL_BASE(),Object.assign({method:'POST'},opt));
 t.gcalId=(await r.json()).id;
}
async function calDelete(t){
 if(!t.gcalId)return;
 try{await dFetch(CAL_BASE()+'/'+t.gcalId,{method:'DELETE'});}
 catch(err){if(!/\b(404|410)\b/.test(err.message))throw err;}
 delete t.gcalId;delete t.gcalSig;
}
async function pushCalendar(manual){
 if(!D.settings.calSync){if(manual)toast('Activa la sincronización con Calendar');return;}
 if(!navigator.onLine){if(manual)toast('Sin conexión: se enviará al volver internet');return;}
 if(calPushing)return;calPushing=true;syncUI();
 /* Reparación única: los eventos creados por la versión con el fallo de PATCH
    quedaron mal (sin hora / sin descripción) pero con su firma "al día", así que
    se saltarían. Limpiamos las firmas una sola vez para reescribirlos todos. */
 if(!M.calRepair){M.calRepair=nowISO();D.tasks.forEach(t=>{if(t.gcalId)delete t.gcalSig;});persist();}
 let changed=0,errs=0,firstErr='';
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 try{
  if(!await ensureToken())throw new Error('No se pudo autorizar con Google (revisa el ID de cliente y acepta el permiso de calendario)');
  // 1) altas/cambios: tareas con fecha
  for(const t of liveTasks()){
   const hasDate=!!dOnly(t.v.date),sig=calSig(t);
   try{
    if(hasDate){ if(t.gcalId&&t.gcalSig===sig)continue; await calUpsert(t); t.gcalSig=sig; changed++; await wait(120); }
    else if(t.gcalId){ await calDelete(t); changed++; await wait(120); }
   }catch(err){
    errs++;if(!firstErr)firstErr=err.message;
    if(/401|caducada/.test(err.message)){accessToken=null;throw err;}
    // si falla sistemáticamente (permiso, calendario inexistente…) no insistas 95 veces
    if(errs>=4)throw new Error('Detenido tras varios fallos. Causa: '+firstErr);
   }
  }
  // 2) bajas: tareas eliminadas que aún tienen evento
  for(const t of D.tasks.filter(x=>x.deletedAt&&x.gcalId)){
   try{await calDelete(t);changed++;await wait(120);}catch(err){errs++;if(!firstErr)firstErr=err.message;}
  }
  M.calLast=nowISO();M.calError=errs?(errs+' con error · '+firstErr):null;
  persist();
  if(manual)toast(errs?('Calendar: '+errs+' con error'):(changed?('Calendario actualizado ('+changed+')'):'Calendario ya estaba al día'));
 }catch(err){M.calError=firstErr||err.message;persist();if(manual)toast('Error de Calendar: '+(firstErr||err.message));}
 calPushing=false;syncUI();
}
function scheduleCal(){
 if(!D.settings.calSync)return;
 clearTimeout(calT);calT=setTimeout(()=>pushCalendar(false),4000);
}
function scheduleSync(){
 if(!M.driveOn||!D.settings.autoSync)return;
 clearTimeout(syncT);syncT=setTimeout(()=>syncNow(false),8000);
}
setInterval(()=>{if(M.driveOn&&D&&D.settings.autoSync&&M.pending>0)syncNow(false);},90000);
setInterval(()=>{if(D&&D.settings.calSync&&navigator.onLine)pushCalendar(false);},120000);
addEventListener('online',()=>{syncUI();if(M.driveOn&&M.pending>0)syncNow(false);if(D&&D.settings.calSync)pushCalendar(false);});
addEventListener('offline',syncUI);

/* Estado de sincronización en un solo icono, sin palabras. Regla:
   pendiente es pendiente (⌛) sea cual sea la causa; ✅ = a salvo en la nube,
   🏠 = sólo en este dispositivo. El calendario no afecta a este icono. */
function syncState(){
 if(M.lastError)return{ic:'🔴',txt:'Error de sincronización'+(typeof M.lastError==='string'?': '+M.lastError:'')};
 if(syncing)return{ic:'♻️',txt:'Sincronizando…'};
 if(M.pending>0)return{ic:'⌛',txt:M.pending+' cambio'+(M.pending===1?'':'s')+' pendiente'+(M.pending===1?'':'s')+(navigator.onLine?'':' · sin conexión')};
 if(M.driveOn)return{ic:'✅',txt:'Sincronizado'+(M.lastSync?' · '+relTime(M.lastSync):'')+(navigator.onLine?'':' · sin conexión')};
 return{ic:'🏠',txt:'Sólo en este dispositivo'+(navigator.onLine?'':' · sin conexión')};
}
function syncUI(){
 const chip=$('#syncChip');if(!chip)return;
 const s=syncState();
 chip.innerHTML=`<span class="sicon">${s.ic}</span>`;
 chip.title=s.txt;
}
function relTime(iso){
 const d=Date.now()-new Date(iso).getTime();
 if(d<60000)return'hace un momento';
 if(d<3600000)return'hace '+Math.round(d/60000)+' min';
 if(d<86400000)return'hace '+Math.round(d/3600000)+' h';
 return'hace '+Math.round(d/86400000)+' días';
}
$('#syncChip').onclick=e=>{
 openPop(`
  <div class="mhead">Sincronización</div>
  <div class="mi" style="cursor:default">${syncState().ic}&nbsp;<b>${esc(syncState().txt)}</b></div>
  <div class="mi" style="cursor:default">Última sincronización:&nbsp;<span style="color:var(--tx2)">${M.lastSync?fmtDT(M.lastSync):'nunca'}</span></div>
  <div class="mi" style="cursor:default">Cambios pendientes:&nbsp;<b>${M.pending}</b></div>
  ${M.lastError?`<div class="mi" style="cursor:default;color:var(--err)">${esc(M.lastError)}</div>`:''}
  <div class="msep"></div>
  <button class="mi" id="syNow"><span class="mic">⟳</span>Sincronizar ahora</button>
  <button class="mi" id="syCfg"><span class="mic">⚙</span>Configurar Google Drive…</button>
  <button class="mi" id="syBk"><span class="mic">⬇</span>Descargar respaldo JSON</button>
 `,e.currentTarget,pp=>{
  pp.querySelector('#syNow').onclick=()=>{closePop();syncNow(true);};
  pp.querySelector('#syCfg').onclick=()=>{closePop();openSettings();};
  pp.querySelector('#syBk').onclick=()=>{closePop();doExport('json');};
 });
};

/* ============================ GLOBAL ============================ */
function createTask(){const t=newTask(view(cur).smart==='today'?{date:todayStr()}:{});save();openDrawer(t.id);setTimeout(()=>{const e=$('#dTitle');if(e)e.focus();},60);return t;}
$('#btnSettings').onclick=openSettings;
$('#search').oninput=e=>{searchQ=e.target.value.trim();showN=200;renderMain();renderToolbar();};
function updSearchModeBtn(){const b=$('#searchMode');if(!b)return;
 b.textContent=searchGlobal?'🌐 Global':'🔍 Vista';
 b.classList.toggle('primary',searchGlobal);
 b.title=searchGlobal
   ? 'Búsqueda en TODAS las tareas (ignora los filtros de la vista)'
   : 'Búsqueda dentro de la vista actual (respeta sus filtros)';}
$('#searchMode').onclick=()=>{searchGlobal=!searchGlobal;updSearchModeBtn();
 if(searchQ){showN=200;renderMain();renderToolbar();}};
updSearchModeBtn();
$$('.overlay').forEach(o=>{o.onclick=e=>{if(e.target===o||e.target.closest('[data-close]'))o.classList.remove('show');};});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){
  /* cierra sólo la capa de encima */
  if(pop.classList.contains('show')){closePop();return;}
  const anyModal=$$('.overlay').some(o=>o.classList.contains('show'));
  if(anyModal){$$('.overlay').forEach(o=>o.classList.remove('show'));return;}
  if(section==='notes'){
   /* en móvil, del editor se vuelve a la lista; si ya en la lista, a Tareas */
   if($('#nWrap').classList.contains('ed')){$('#nWrap').classList.remove('ed');return;}
   goSection('tasks');return;
  }
  closeDrawer();}
 if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#search').focus();}
 if(e.key==='n'&&section==='tasks'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!e.ctrlKey&&!e.metaKey){e.preventDefault();createTask();}
});

/* ============================ ARRANQUE ============================ */
/* Migraciones: idempotentes (se pueden ejecutar dos veces sin efecto) y
   nunca destructivas — jamás borran campos que no conozcan, porque otro
   dispositivo con una versión más nueva puede haberlos sincronizado. */
/* Convierte las Notas de texto que ya existían en notas de verdad.
   Claves del diseño:
   · el id se deriva del id de la tarea → dos dispositivos generan el MISMO id
     y al sincronizar se fusionan en vez de duplicarse;
   · no se toca t.updatedAt → la migración no pelea con las ediciones de otro
     dispositivo ni dispara una resincronización masiva;
   · se ejecuta en cada arranque sobre cualquier valor que siga siendo texto,
     así se auto-repara si un móvil con la versión antigua devuelve el texto. */
function migrateNoteRefs(){
 const p=D.props.find(x=>x.id==='notes');
 if(!p)return;
 D.tasks.forEach(t=>{
  const txt=t.v&&t.v.notes;
  if(typeof txt!=='string'||!txt.trim())return;
  const nid='n_of_'+t.id;
  if(!D.notes.some(n=>n.id===nid))
   D.notes.push({id:nid,title:(t.v.name||'Nota').slice(0,60),
    blocks:[{id:'b_of_'+t.id,type:'md',title:'',text:txt,updatedAt:t.updatedAt||nowISO()}],
    createdAt:t.createdAt||nowISO(),updatedAt:t.updatedAt||nowISO()});
  t.v.notes=[nid];
 });
 if(p.type==='text'){p.type='noteref';p.updatedAt=nowISO();}
}
function migrate(){
 const s=D.settings;
 if(!Array.isArray(s.defaultVisibleProps))s.defaultVisibleProps=['date','status','desc'];
 if(s.calDurationMin==null)s.calDurationMin=60;
 if(!Array.isArray(D.notes))D.notes=[];
 if(!Array.isArray(s.pinnedViews))s.pinnedViews=['v_all','v_today','v_cal'].filter(id=>D.views.some(v=>v.id===id));
 if(!Array.isArray(s.notesCollapsedAreas))s.notesCollapsedAreas=[];
 migrateNoteRefs();
 /* Nota: las propiedades que ya tienen datos en una tarea siguen visibles en
    esa tarea por la regla hasValue(), así que no hace falta tocar drawerShow
    de los usuarios existentes: nada desaparece y las tareas nuevas quedan
    limpias, que es justo lo pedido. */
 D.version=Math.max(D.version||1,4);
}
async function boot(){
 await idb.open();
 const savedDoc=await idb.get('doc'),savedMeta=await idb.get('meta');
 if(savedDoc){D=savedDoc;if(savedMeta)M=Object.assign(M,savedMeta);}
 else{
  D=defaultDoc();
  // primer arranque: intenta cargar tareas iniciales si el archivo existe junto a la app
  try{const r=await fetch('tareas-iniciales.json',{cache:'no-store'});
   if(r.ok){const j=await r.json();
    if(j&&j.tasks){D.tasks=j.tasks;collectOptions();toast(j.tasks.length+' tareas cargadas desde tareas-iniciales.json');}}
  }catch(_){/* sin archivo inicial */}
 }
 // migraciones suaves
 migrate();
 D.views.forEach(v=>{v.filters=v.filters||[];v.cols=v.cols||['name'];});
 applyTheme();
 cur=(D.views.find(v=>!v.hidden)||D.views[0]).id;
 render();syncUI();
 if(M.driveOn&&D.settings.autoSync&&navigator.onLine)setTimeout(()=>syncNow(false),1500);
 if(D.settings.calSync&&navigator.onLine)setTimeout(()=>pushCalendar(false),2500);
 if('serviceWorker'in navigator){try{navigator.serviceWorker.register('sw.js');}catch(_){}}
}
boot();
