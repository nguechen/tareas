<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#191919">
<title>Tareas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#191919; --bg2:#202020; --bg3:#2a2a2a; --bg4:#333;
  --line:#333; --line2:#3f3f3f;
  --tx:#d4d4d4; --tx2:#9b9b9b; --tx3:#6f6f6f;
  --acc:#2383e2; --acc-tx:#fff;
  --ok:#2e9e5b; --warn:#c99b2e; --err:#d44c47;
  --chip-gray:#5a5a5a; --chip-blue:#2383e2; --chip-green:#2e9e5b; --chip-orange:#d9730d;
  --chip-red:#d44c47; --chip-purple:#9065b0; --chip-yellow:#c99b2e; --chip-pink:#c14c8a;
  --chip-brown:#8a6a52; --chip-cyan:#2b8a9e;
  --shadow:0 8px 30px rgba(0,0,0,.5);
  --r:6px;
}
html[data-theme="light"]{
  --bg:#ffffff; --bg2:#f7f7f5; --bg3:#efefec; --bg4:#e6e6e2;
  --line:#e4e4e0; --line2:#d5d5d0;
  --tx:#37352f; --tx2:#787670; --tx3:#a5a29a;
  --shadow:0 8px 30px rgba(0,0,0,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r);padding:5px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:5px}
a{color:var(--acc)}

/* ---------- Header ---------- */
header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);flex:none}
.logo{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.logo .mark{width:20px;height:20px;border-radius:5px;background:var(--acc);display:grid;place-items:center;color:#fff;font-size:12px}
#syncChip{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);font-size:12px;color:var(--tx2);white-space:nowrap}
#syncChip:hover{background:var(--bg3)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tx3);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
#search{flex:1;max-width:340px;background:var(--bg2);border-color:var(--line)}
#searchMode{font-size:12px;padding:5px 9px;flex:none}
.spacer{flex:1}
.btn{padding:5px 11px;border-radius:var(--r);border:1px solid var(--line2);background:var(--bg2);white-space:nowrap}
.btn:hover{background:var(--bg3)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-tx);font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--err);border-color:var(--err)}
.iconbtn{width:30px;height:30px;border-radius:var(--r);display:grid;place-items:center;font-size:16px;color:var(--tx2)}
.iconbtn:hover{background:var(--bg3);color:var(--tx)}

/* ---------- Tabs ---------- */
nav#tabs{display:flex;align-items:center;gap:2px;padding:4px 10px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--r);color:var(--tx2);white-space:nowrap;font-size:13px;border:1px solid transparent}
.tab:hover{background:var(--bg3);color:var(--tx)}
.tab.on{background:var(--bg3);color:var(--tx);font-weight:600}
.tab.dragover{border-color:var(--acc)}
.tab .cnt{font-size:11px;color:var(--tx3);background:var(--bg4);border-radius:99px;padding:0 6px}
.tab .more{display:none;color:var(--tx3);font-size:12px;padding:0 2px}
.tab.on .more{display:inline}
#addView{color:var(--tx3);padding:5px 8px}

/* ---------- Toolbar ---------- */
#toolbar{display:flex;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none;min-height:40px}
.pill{display:flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:99px;border:1px dashed var(--line2);color:var(--tx2)}
.pill.on{border-style:solid;border-color:var(--acc);color:var(--acc)}
.pill:hover{background:var(--bg3)}
#bulkbar{display:none;align-items:center;gap:8px;background:var(--acc);color:#fff;border-radius:var(--r);padding:4px 10px;font-size:13px}
#bulkbar.show{display:flex}
#bulkbar button{color:#fff;text-decoration:underline;font-size:12px}

/* ---------- Main / Table ---------- */
main{flex:1;overflow:auto;position:relative}
table.grid{border-collapse:collapse;min-width:100%;font-size:13.5px}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:left;vertical-align:middle}
.grid th{position:sticky;top:0;background:var(--bg);z-index:2;color:var(--tx2);font-weight:500;font-size:12.5px;user-select:none}
.grid th .th-in{display:flex;align-items:center;gap:5px;padding:7px 9px;cursor:pointer}
.grid th .th-in:hover{background:var(--bg3)}
.grid th.dragover{border-left:2px solid var(--acc)}
.grid td{height:34px}
.cell{padding:6px 9px;min-height:34px;display:flex;align-items:center;gap:5px;cursor:default;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cell:hover{background:var(--bg2)}
.cell.editing{padding:0}
.cell input,.cell select{width:100%;height:34px;border-radius:0;border:2px solid var(--acc);background:var(--bg2)}
/* Celdas multilínea (descripciones/notas en el panel de detalle) */
.cell.multi{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;text-overflow:clip;align-items:flex-start;height:auto}
.cell textarea{width:100%;min-height:34px;border-radius:0;border:2px solid var(--acc);background:var(--bg2);
  padding:6px 9px;resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;
  line-height:1.45;display:block;font:inherit;color:inherit}
td.selcol,th.selcol{width:34px;text-align:center;border-right:none}
td.selcol input,th.selcol input{cursor:pointer}
tr.trow:hover td{background:var(--bg2)}
tr.trow.sel td{background:color-mix(in srgb,var(--acc) 12%,var(--bg))}
tr.done .tname{color:var(--tx3);text-decoration:line-through}
.tname{font-weight:500;display:flex;align-items:center;gap:7px;overflow:hidden}
.tname .txt{overflow:hidden;text-overflow:ellipsis}
/* Siempre visible: en pantallas táctiles no existe el :hover, así que un botón
   que sólo aparece al pasar el ratón es un botón que no existe en el móvil. */
.openb{opacity:.7;font-size:11px;border:1px solid var(--line2);border-radius:4px;padding:1px 6px;color:var(--tx2);flex:none;background:var(--bg2)}
tr:hover .openb,.openb:hover,.openb:focus{opacity:1;color:var(--tx);border-color:var(--tx3)}
.donechk{width:15px;height:15px;border-radius:50%;border:1.6px solid var(--tx3);flex:none;display:grid;place-items:center;font-size:10px;color:#fff;cursor:pointer}
.donechk.on{background:var(--ok);border-color:var(--ok)}
.tag{display:inline-flex;align-items:center;border-radius:4px;padding:1px 7px;font-size:12px;color:#fff;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.st{border-radius:99px}
.overdue{color:var(--err)}
.grp{background:var(--bg2);font-weight:600;font-size:12.5px;color:var(--tx2);cursor:pointer}
.grp td{padding:6px 10px}
.newrow td{color:var(--tx3);cursor:pointer;padding:7px 10px}
.newrow td:hover{color:var(--tx)}
#morebtn{margin:10px 14px;color:var(--tx2)}
.empty{padding:60px 20px;text-align:center;color:var(--tx3)}
.empty b{display:block;font-size:16px;color:var(--tx2);margin-bottom:6px}

/* ---------- Calendar ---------- */
#cal{display:flex;flex-direction:column;height:100%}
.cal-head{display:flex;align-items:center;gap:10px;padding:10px 14px;flex:none}
.cal-head h2{font-size:16px;text-transform:capitalize}
.cal-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(110px,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);overflow:auto}
.cal-dow{padding:5px 8px;font-size:11.5px;color:var(--tx2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0}
.cal-day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;overflow:hidden;display:flex;flex-direction:column;gap:3px;min-height:110px}
.cal-day.out{background:var(--bg2);color:var(--tx3)}
.cal-day.dragover{background:color-mix(in srgb,var(--acc) 15%,var(--bg))}
.cal-day .dnum{font-size:12px;color:var(--tx2);padding:2px 4px;align-self:flex-start;border-radius:99px}
.cal-day.today .dnum{background:var(--acc);color:#fff;font-weight:700}
.chip{font-size:12px;padding:2px 7px;border-radius:4px;background:var(--bg3);border:1px solid var(--line2);cursor:grab;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:flex;gap:5px;align-items:center}
.chip .cdot{width:7px;height:7px;border-radius:50%;flex:none}
.chip.od{border-color:var(--err);color:var(--err)}
.chip.dn{opacity:.5;text-decoration:line-through}
.chip:hover{background:var(--bg4)}
.cal-day .qadd{border:none;background:none;color:var(--tx3);opacity:.75;font-size:12px;text-align:left;padding:1px 6px;flex:1;min-height:14px;cursor:pointer}
.cal-day:hover .qadd,.cal-day .qadd:hover,.cal-day .qadd:focus{opacity:1;color:var(--tx);background:var(--bg3);border-radius:4px}

/* ---------- Board ---------- */
#board{display:flex;gap:12px;padding:14px;overflow-x:auto;height:100%;align-items:flex-start}
.bcol{min-width:250px;max-width:250px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;max-height:100%}
.bcol h3{font-size:13px;padding:9px 11px;display:flex;gap:7px;align-items:center;color:var(--tx2);flex:none}
.bcol .cards{padding:0 8px 8px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.bcard{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;cursor:grab;font-size:13px}
.bcard:hover{border-color:var(--tx3)}
.bcard .bd{font-size:11.5px;color:var(--tx2);margin-top:3px}
.bcol.dragover{outline:2px solid var(--acc)}

/* ---------- Drawer ---------- */
#drawer{position:fixed;top:0;right:-520px;width:min(520px,100vw);height:100%;background:var(--bg);border-left:1px solid var(--line);z-index:50;transition:right .18s ease;display:flex;flex-direction:column;box-shadow:var(--shadow)}
#drawer.open{right:0}
#drawer .dr-top{display:flex;align-items:center;gap:8px;padding:10px 14px;flex:none}
#drawer .dr-body{flex:1;overflow-y:auto;padding:4px 26px 30px}
#dTitle{width:100%;background:none;border:none;font-size:24px;font-weight:700;padding:6px 0;color:var(--tx)}
.dprop{display:flex;align-items:flex-start;gap:10px;padding:5px 0;min-height:34px}
.dprop .dlab{width:130px;flex:none;color:var(--tx2);font-size:13px;padding-top:5px;display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dprop .dval{flex:1;min-width:0}
.dval .cell{padding:5px 8px;border-radius:var(--r);min-height:30px}
.dval .cell:hover{background:var(--bg3)}
#dAddProp{color:var(--tx3);padding:8px 0;font-size:13px}
#dAddProp:hover{color:var(--tx)}
/* ---------- Bloques / elementos (tabla, base de datos, to-do) ---------- */
#dAddBlock{color:var(--tx3);padding:8px 0;font-size:13px;display:block}
#dAddBlock:hover{color:var(--tx)}
#dBlocks{margin-top:6px}
.blk{border:1px solid var(--line);border-radius:8px;margin:12px 0;background:var(--bg2)}
.blk-top{display:flex;align-items:center;gap:7px;padding:6px 8px;border-bottom:1px solid var(--line)}
.blk-top .blk-title{flex:1;min-width:0;background:none;border:1px solid transparent;font-weight:600;font-size:13px;padding:3px 5px}
.blk-top .blk-title:hover{border-color:var(--line2)}
.blk-body{padding:6px 8px;overflow-x:auto}
table.btable{border-collapse:collapse;width:100%;font-size:13px}
.btable th,.btable td{border:1px solid var(--line);padding:0;vertical-align:middle}
.btable th{background:var(--bg3)}
.btable input[type=text],.btable input[type=number],.btable input[type=date]{width:100%;min-width:90px;border:none;background:none;border-radius:0;padding:5px 7px}
.btable input:focus{outline:2px solid var(--acc);outline-offset:-2px}
.btable th input{font-weight:600;color:var(--tx2)}
.btable .xcol,.btable .xrow{width:26px;text-align:center;color:var(--tx3);background:none;border:none}
.btable .xcol:hover,.btable .xrow:hover{color:var(--err)}
.btable select{border:none;background:none;border-radius:0;padding:4px;font-size:12px;color:var(--tx3);width:100%}
.blk-add{color:var(--tx3);font-size:12.5px;padding:5px 4px}
.blk-add:hover{color:var(--tx)}
.todo-it{display:flex;align-items:center;gap:8px;padding:3px 2px}
.todo-it input[type=checkbox]{width:15px;height:15px;flex:none;cursor:pointer}
.todo-it .todo-txt{flex:1;min-width:0;background:none;border:1px solid transparent;padding:4px 6px}
.todo-it .todo-txt:hover{border-color:var(--line2)}
.todo-it.done .todo-txt{color:var(--tx3);text-decoration:line-through}
.todo-it .xrow{color:var(--tx3);background:none;border:none;padding:0 4px}
.todo-it .xrow:hover{color:var(--err)}
/* ---------- Markdown ---------- */
.md{padding:4px 2px;line-height:1.6;cursor:text;overflow-wrap:anywhere}
.md:hover{background:var(--bg3);border-radius:var(--r)}
.md h1{font-size:20px;margin:8px 0 4px} .md h2{font-size:17px;margin:8px 0 4px}
.md h3{font-size:15px;margin:6px 0 3px} .md h4,.md h5,.md h6{font-size:13.5px;margin:6px 0 3px}
.md p{margin:5px 0} .md ul,.md ol{margin:5px 0 5px 20px} .md li{margin:2px 0}
.md li.md-task{list-style:none;margin-left:-16px}
.md blockquote{border-left:3px solid var(--line2);margin:6px 0;padding:2px 10px;color:var(--tx2)}
.md hr{border:none;border-top:1px solid var(--line);margin:10px 0}
.md code{background:var(--bg3);padding:1px 5px;border-radius:4px;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
.md pre{background:var(--bg3);padding:9px 11px;border-radius:6px;overflow-x:auto;margin:7px 0}
.md pre code{background:none;padding:0;white-space:pre}
.md a{text-decoration:underline}
.md table.md-table{border-collapse:collapse;margin:7px 0;font-size:13px}
.md .md-table th,.md .md-table td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.md .md-table th{background:var(--bg3)}
.md img{max-width:100%}
.blk-body textarea{width:100%;min-height:60px;border:2px solid var(--acc);border-radius:var(--r);background:var(--bg);
  padding:7px 9px;resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;
  display:block;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;color:inherit}

/* ---------- Popover / menus ---------- */
#pop{position:fixed;z-index:100;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);min-width:220px;max-width:330px;max-height:60vh;overflow-y:auto;display:none;padding:5px}
#pop.show{display:block}
.mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 9px;border-radius:5px;font-size:13px}
.mi:hover{background:var(--bg3)}
.mi.sel{background:var(--bg3)}
.mi .mic{width:16px;text-align:center;color:var(--tx2);flex:none}
.msep{height:1px;background:var(--line);margin:5px 0}
.mhead{font-size:11px;color:var(--tx3);padding:5px 9px;text-transform:uppercase;letter-spacing:.4px}
#pop input.minput{width:100%;margin:2px 0 5px}
.swatches{display:flex;gap:5px;padding:5px 9px;flex-wrap:wrap}
.sw{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw.on{border-color:var(--tx)}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--bg);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);width:640px;max-width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal .m-top{display:flex;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);font-weight:600;flex:none}
.modal .m-body{padding:16px 18px;overflow-y:auto}
.modal .m-foot{padding:11px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex:none}
.sect{margin-bottom:22px}
.sect h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);margin-bottom:9px}
.row{display:flex;align-items:center;gap:9px;padding:5px 0;flex-wrap:wrap}
.row label{color:var(--tx2);min-width:150px}
.listrow{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:var(--r);border:1px solid transparent}
.listrow:hover{background:var(--bg2)}
.listrow.dragover{border-color:var(--acc)}
.listrow .grab{cursor:grab;color:var(--tx3)}
.listrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eye{color:var(--tx2)} .eye.off{color:var(--tx3);opacity:.5}
.maptable{width:100%;border-collapse:collapse;font-size:13px}
.maptable td,.maptable th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.help{font-size:12.5px;color:var(--tx2);line-height:1.55}
.help code{background:var(--bg3);padding:1px 5px;border-radius:4px;font-size:12px}
.kbd{font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--tx2)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line2);border-radius:8px;padding:9px 16px;z-index:200;box-shadow:var(--shadow);display:none;font-size:13px}
#toast.show{display:block}
/* ---------- Navegación de secciones ---------- */
.tab.temp{border-style:dashed;opacity:.92}
.tab .closetab{margin-left:2px;opacity:.7;font-size:11px}
.tab .closetab:hover{opacity:1;color:var(--err)}
.pinbtn{background:none;border:none;cursor:pointer;opacity:.75;padding:2px 6px}
.pinbtn:hover{opacity:1}
.nav{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--tx2);
  font-size:14px;font-weight:600;padding:6px 10px;border-radius:var(--r);cursor:pointer}
.nav:hover{background:var(--bg2);color:var(--tx)}
.nav[aria-current="page"]{color:var(--tx);background:var(--bg3)}
.nav .mark{color:var(--acc)}
#tasksPage{flex:1;min-height:0;display:flex;flex-direction:column}
#tasksPage[hidden]{display:none}
#notesPage{flex:1;display:flex;min-height:0;overflow:hidden}
#notesPage[hidden]{display:none}
/* ---------- Notas ---------- */
.cell.noteref{flex-wrap:wrap;gap:5px}
.nchip{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--line2);
  border-radius:99px;padding:2px 4px 2px 9px;font-size:12px;max-width:100%}
.nchip .nctx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.nlink{color:var(--tx2)}
.nlink:hover{color:var(--acc)}
.notes-wrap{flex:1;display:flex;min-height:0;width:100%}
.notes-list{width:290px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.notes-tools{padding:11px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.notes-tools input{width:100%}
#nList{flex:1;overflow-y:auto;padding:6px}
.nitem{padding:8px 10px;border-radius:var(--r);cursor:pointer;border:1px solid transparent}
.nitem:hover{background:var(--bg2)}
.nitem.on{background:var(--bg3);border-color:var(--line2)}
.nitem .nt{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nitem .np{font-size:11.5px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.notes-ed{flex:1;overflow-y:auto;padding:18px 26px 40px;min-width:0}

<script>
'use strict';
/* ============================================================
   TAREAS — gestor de tareas offline-first estilo Notion
   Un solo archivo · IndexedDB · PWA · Google Drive opcional
   ============================================================ */

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'x')+'_'+Math.random().toString(36).slice(2,10);
const nowISO=()=>new Date().toISOString();
/* Compara marcas de tiempo mezcladas: los objetos recién creados llevan
   updatedAt:0 (número) y los editados una fecha ISO (texto). Comparar
   '2026-…' > 0 hace que JS convierta el texto a NaN y devuelva SIEMPRE false,
   así que sin este normalizador los cambios remotos de vistas, propiedades y
   ajustes nunca ganaban. */
const isNewer=(a,b)=>String(a||'')>String(b||'');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dOnly=v=>v?String(v).slice(0,10):'';
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const COLORS=['gray','blue','green','orange','red','purple','yellow','pink','brown','cyan'];
const cvar=c=>`var(--chip-${COLORS.includes(c)?c:'gray'})`;
const hashColor=s=>{let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))>>>0;return COLORS[h%COLORS.length];};
const fmtDate=v=>{if(!v)return'';const d=new Date(v.length===10?v+'T12:00':v);if(isNaN(d))return v;
  const t=todayStr(),ds=dOnly(v);let s=d.toLocaleDateString('es',{day:'numeric',month:'short'})+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'');
  if(ds===t)s='Hoy';else if(ds===addDays(t,1))s='Mañana';else if(ds===addDays(t,-1))s='Ayer';
  if(v.length>10)s+=' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');return s;};
const fmtDT=v=>{if(!v)return'';const d=new Date(v);return isNaN(d)?v:d.toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});};

const TYPES={
  title:{n:'Título',ic:'Aa'}, text:{n:'Texto',ic:'≡'}, number:{n:'Número',ic:'#'},
  status:{n:'Estado',ic:'◐'}, date:{n:'Fecha',ic:'📅'}, checkbox:{n:'Casilla',ic:'☑'},
  select:{n:'Selección única',ic:'◉'}, multi:{n:'Selección múltiple',ic:'≔'},
  url:{n:'URL',ic:'🔗'}, email:{n:'Correo',ic:'@'}, phone:{n:'Teléfono',ic:'📞'},
  person:{n:'Persona',ic:'👤'}, formula:{n:'Fórmula',ic:'Σ'},
  noteref:{n:'Notas',ic:'🗒'},
  created:{n:'Fecha de creación',ic:'🕓'}, edited:{n:'Última edición',ic:'🕓'},
};

/* ---------- documento por defecto ---------- */
function defaultDoc(){
 const P=(id,name,type,x)=>Object.assign({id,name,type,updatedAt:0},x||{});
 const O=(name,color,kind)=>({id:uid('o'),name,color,kind});
 return {
  version:1,
  props:[
   P('name','Nombre','title'),
   P('date','Fecha','date'),
   P('status','Status','status',{options:[
     O('Inbox','gray','todo'),O('Acción','orange','todo'),O('Agenda','purple','todo'),
     O('En proceso','blue','active'),O('A la espera','cyan','active'),
     O('Algún día','brown','todo'),O('Archivo de seguimiento','gray','todo'),
     O('Completada','green','done'),O('Archivada','gray','done')]}),
   P('desc','Descripción','text'),
   P('prio','Prioridad','select',{options:[O('Urgente','red'),O('Alta','orange'),O('Media','yellow'),O('Baja','gray')]}),
   P('ctx','Contexto','select',{options:[O('🏡Casa','green'),O('💻PC/oficina','blue'),O('🛻Calle','orange'),O('📱Móvil','purple')]}),
   P('tags','Etiquetas','multi',{options:[O('Delegada','pink'),O('CORREO','orange'),O('BODEGA-2','purple'),O('1-1','gray')]}),
   P('area','Area','select',{options:[O('Personal','green'),O('Laboral','blue'),O('Salud','red'),O('Familia','yellow')],hidden:true}),
   P('energy','Energía','select',{options:[O('Low','gray'),O('Medium','yellow'),O('High','red')],hidden:true}),
   P('project','Proyecto','select',{options:[],hidden:true}),
   P('who','Delegada a','person',{hidden:true}),
   P('url','URL','url',{hidden:true}),
   P('notes','Notas','noteref',{hidden:true}),
   P('created','Creado','created',{hidden:true}),
   P('edited','Editado','edited',{hidden:true}),
  ],
  tasks:[],
  notes:[],
  views:[
   {id:'v_all',name:'Tabla',icon:'▦',kind:'table',smart:null,builtin:1,filters:[],sort:{prop:'date',dir:1},group:null,cols:['name','date','status','desc','prio','tags'],updatedAt:0},
   {id:'v_today',name:'Hoy',icon:'☀',kind:'table',smart:'today',builtin:1,filters:[],sort:{prop:'date',dir:1},group:null,cols:['name','date','status','prio','ctx'],updatedAt:0},
   {id:'v_week',name:'Esta semana',icon:'▤',kind:'table',smart:'week',builtin:1,filters:[],sort:{prop:'date',dir:1},group:'date',cols:['name','date','status','prio','desc'],updatedAt:0},
   {id:'v_urgent',name:'Urgentes',icon:'❗',kind:'table',smart:'urgent',builtin:1,filters:[],sort:{prop:'date',dir:1},group:null,cols:['name','date','status','prio','desc'],updatedAt:0},
   {id:'v_ctx',name:'Contextos',icon:'◈',kind:'table',smart:'open',builtin:1,filters:[],sort:{prop:'date',dir:1},group:'ctx',cols:['name','date','status','prio'],updatedAt:0},
   {id:'v_deleg',name:'Delegadas',icon:'👥',kind:'table',smart:'delegated',builtin:1,filters:[],sort:{prop:'date',dir:1},group:null,cols:['name','date','status','who','desc'],updatedAt:0},
   {id:'v_log',name:'Logbook',icon:'▣',kind:'table',smart:'done',builtin:1,filters:[],sort:{prop:'edited',dir:-1},group:null,cols:['name','date','status','edited'],updatedAt:0},
   {id:'v_cal',name:'Calendario',icon:'▦',kind:'calendar',smart:null,builtin:1,filters:[],sort:{prop:'date',dir:1},group:null,cols:['name'],updatedAt:0},
   {id:'v_board',name:'Tablero',icon:'▥',kind:'board',smart:'open',builtin:1,filters:[],sort:{prop:'date',dir:1},group:'status',cols:['name','date'],updatedAt:0},
  ],
  settings:{theme:'dark',accent:'#2383e2',clientId:'',autoSync:true,calSync:false,calId:'primary',calDurationMin:60,
    defaultVisibleProps:['date','status','desc'],pinnedViews:['v_all','v_today','v_cal'],notesCollapsedAreas:[],updatedAt:0},
 };
}

/* ---------- estado ---------- */
let D=null;                 // documento (props, tasks, views, settings)
let M={lastSync:null,pending:0,driveOn:false,driveFileId:null,lastError:null};
let cur='v_all';            // vista activa
let selIds=new Set();       // selección múltiple
let openId=null;            // tarea abierta en drawer
let searchQ='';
let searchGlobal=false;     // false = buscar dentro de la vista (respeta filtros) · true = en TODAS las tareas
let calMonth=null;          // 'YYYY-MM'
let showN=200;              // paginación
let collapsed=new Set();    // grupos colapsados

/* ---------- IndexedDB ---------- */
const idb={
 db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('tareas-app',1);
   r.onupgradeneeded=()=>r.result.createObjectStore('kv');
   r.onsuccess=()=>{idb.db=r.result;res();};r.onerror=()=>rej(r.error);});},
 get(k){return new Promise((res,rej)=>{const t=idb.db.transaction('kv').objectStore('kv').get(k);
   t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});},
 set(k,v){return new Promise((res,rej)=>{const t=idb.db.transaction('kv','readwrite').objectStore('kv').put(v,k);
   t.onsuccess=()=>res();t.onerror=()=>rej(t.error);});}
};
let persistT=null;
function persist(){clearTimeout(persistT);persistT=setTimeout(()=>{idb.set('doc',JSON.parse(JSON.stringify(D)));idb.set('meta',JSON.parse(JSON.stringify(M)));},150);}

/* guardar: toda mutación pasa por aquí */
function save(opts){
 opts=opts||{};
 if(!opts.silent){M.pending++;M.lastError=null;scheduleSync();scheduleCal();}
 persist();syncUI();
 if(!opts.noRender)render();
}

/* ---------- helpers de modelo ---------- */
const prop=id=>D.props.find(p=>p.id===id);
const view=id=>D.views.find(v=>v.id===id);
const task=id=>D.tasks.find(t=>t.id===id&&!t.deletedAt);
const liveTasks=()=>D.tasks.filter(t=>!t.deletedAt);
const statusProp=()=>D.props.find(p=>p.type==='status')||prop('status');
function optOf(p,name){return (p.options||[]).find(o=>o.name===name);}
function statusKind(t){const p=statusProp();if(!p)return'todo';const o=optOf(p,t.v[p.id]);return o?(o.kind||'todo'):'todo';}
const isDone=t=>statusKind(t)==='done';
const isOverdue=t=>{const d=dOnly(t.v.date);return d&&d<todayStr()&&!isDone(t);};

function touch(t){t.updatedAt=nowISO();}
function setVal(t,pid,val){
 if(val===''||val==null||(Array.isArray(val)&&!val.length))delete t.v[pid];else t.v[pid]=val;
 touch(t);save();
}
function newTask(vals){
 const t={id:uid('t'),v:Object.assign({status:'Inbox'},vals||{}),createdAt:nowISO(),updatedAt:nowISO()};
 if(!t.v.name)t.v.name='';
 D.tasks.push(t);return t;
}
function delTask(t){t.deletedAt=nowISO();touch(t);selIds.delete(t.id);if(openId===t.id)closeDrawer();}
function ensureOption(p,name){
 if(!name)return;p.options=p.options||[];
 if(!optOf(p,name)){p.options.push({id:uid('o'),name,color:hashColor(name)});p.updatedAt=nowISO();}
}

/* ¿cuántas cosas usan esta opción? Sirve para decidir si se puede borrar.
   Cuenta tareas VIVAS (no lápidas) y —para el área— también las notas, porque
   notas y tareas comparten la lista de áreas (fase 3). */
function optionUsage(p,name){
 let tasks=0,notes=0;
 liveTasks().forEach(t=>{
  const v=t.v[p.id];
  if(Array.isArray(v)){if(v.includes(name))tasks++;}
  else if(v===name)tasks++;
 });
 if(p.id==='area')liveNotes().forEach(n=>{if(n.area===name)notes++;});
 return {tasks,notes,total:tasks+notes};
}
function usageReason(u){
 const parts=[];
 if(u.tasks)parts.push(u.tasks+' tarea'+(u.tasks===1?'':'s'));
 if(u.notes)parts.push(u.notes+' nota'+(u.notes===1?'':'s'));
 return parts.join(' y ')+' usa'+(u.total===1?'':'n')+' esta opción';
}
function deleteOption(p,name){
 p.options=(p.options||[]).filter(o=>o.name!==name);
 p.updatedAt=nowISO();save();
}

/* Picker propio para celdas de selección de una base de datos. Las opciones son
   privadas de ese bloque (texto plano). Permite elegir, crear y borrar; la ✕
   sólo si ninguna fila del bloque usa la opción. */
function dbSelectMenu(anchor,b,r,p,owner){
 p.options=p.options||[];
 const usedBy=name=>b.rows.filter(x=>x.v[p.id]===name).length;
 const cur=r.v[p.id];
 const draw=()=>`<input class="minput" id="dsQ" placeholder="Buscar o crear…">
  <div id="dsList">${p.options.map(o=>{
    const n=usedBy(o);
    return`<div class="mi listrow" style="cursor:default">
      <span class="nm" data-opt="${esc(o)}" style="cursor:pointer;flex:1">${cur===o?'✓ ':''}${esc(o)}</span>
      <button class="xopt" data-optdel="${esc(o)}" ${n?'disabled title="'+n+' fila'+(n===1?'':'s')+' usa'+(n===1?'':'n')+' esta opción"':'title="Eliminar opción"'}>✕</button>
    </div>`;}).join('')||'<div class="mi" style="color:var(--tx3);cursor:default">Sin opciones aún</div>'}</div>
  ${cur?'<div class="msep"></div><button class="mi" data-dsclear><span class="mic">✕</span>Quitar valor</button>':''}`;
 openPop(draw(),anchor,pp=>{
  const rewire=()=>{
   pp.querySelectorAll('[data-opt]').forEach(el=>el.onclick=()=>{
    r.v[p.id]=el.dataset.opt;blkChanged(owner,b,true);closePop();});
   pp.querySelectorAll('[data-optdel]').forEach(btn=>{if(btn.disabled)return;
    btn.onclick=e=>{e.stopPropagation();
     p.options=p.options.filter(o=>o!==btn.dataset.optdel);
     if(r.v[p.id]===btn.dataset.optdel)delete r.v[p.id];
     blkChanged(owner,b,false);
     pp.querySelector('#dsList').innerHTML='';pp.innerHTML=draw();rewire();
     pp.querySelector('#dsQ').focus();};});
   const clr=pp.querySelector('[data-dsclear]');if(clr)clr.onclick=()=>{delete r.v[p.id];blkChanged(owner,b,true);closePop();};
   const q=pp.querySelector('#dsQ');
   q.oninput=()=>{const s=q.value.toLowerCase();
    pp.querySelectorAll('.listrow').forEach(row=>{const nm=row.querySelector('[data-opt]');row.style.display=nm.dataset.opt.toLowerCase().includes(s)?'':'none';});};
   q.onkeydown=e=>{if(e.key==='Enter'&&q.value.trim()){
    const name=q.value.trim();
    if(!p.options.includes(name))p.options.push(name);
    r.v[p.id]=name;blkChanged(owner,b,true);closePop();}};
  };
  rewire();pp.querySelector('#dsQ').focus();
 });
}
/* valor mostrado (incluye fórmulas) */
function propValue(t,p){
 if(p.type==='created')return t.createdAt;
 if(p.type==='edited')return t.updatedAt;
 if(p.type==='formula')return evalFormula(p.formula||'',t);
 return t.v[p.id];
}
/* fórmula básica: {Prop} + - * / comparaciones, dias({Fecha}) */
function evalFormula(f,t){
 if(!f)return'';
 try{
  let e=f.replace(/dias\(\s*\{([^}]+)\}\s*\)/g,(_,n)=>{const p=D.props.find(x=>x.name===n);const v=p?dOnly(propValue(t,p)):'';
    return v?String(Math.round((new Date(v+'T12:00')-new Date(todayStr()+'T12:00'))/864e5)):'null';});
  e=e.replace(/\{([^}]+)\}/g,(_,n)=>{const p=D.props.find(x=>x.name===n);let v=p?propValue(t,p):null;
    if(Array.isArray(v))v=v.join(', ');return JSON.stringify(v??'');});
  if(/[^-+*/%()<>=!&|?:.,'"\s\wáéíóúñÁÉÍÓÚÑ]/.test(e))return'⚠';
  const r=Function('"use strict";return('+e+')')();
  return r===true?'✓':r===false?'✗':(r??'');
 }catch(_){return'⚠';}
}

/* ---------- vistas inteligentes ---------- */
function smartMatch(sm,t){
 const done=isDone(t),d=dOnly(t.v.date),T=todayStr();
 switch(sm){
  case'today':return !done&&((d&&d<=T)||statusKind(t)==='active');
  case'week':return !done&&d&&d<=addDays(T,7);
  case'urgent':return !done&&(['Alta','Urgente'].includes(t.v.prio)||(d&&d<T));
  case'delegated':return !done&&(t.v.status==='A la espera'||!!t.v.who||(t.v.tags||[]).includes('Delegada'));
  case'done':return done;
  case'open':return !done;
  default:return true;
 }
}
function passFilter(f,t){
 const p=prop(f.prop);if(!p)return true;
 let v=propValue(t,p);const val=f.value;
 const s=Array.isArray(v)?v.join(', '):String(v??'');
 switch(f.op){
  case'empty':return v==null||s==='';
  case'nempty':return v!=null&&s!=='';
  case'eq':return Array.isArray(v)?v.includes(val):s===String(val);
  case'neq':return Array.isArray(v)?!v.includes(val):s!==String(val);
  case'contains':return s.toLowerCase().includes(String(val).toLowerCase());
  case'gt':return p.type==='number'?+v>+val:dOnly(v)>dOnly(val);
  case'lt':return p.type==='number'?+v<+val:dOnly(v)<dOnly(val)&&s!=='';
  case'today':return dOnly(v)===todayStr();
  case'overdue':return dOnly(v)&&dOnly(v)<todayStr()&&!isDone(t);
  default:return true;
 }
}
function matchFilters(v,t){
 if(!v.filters||!v.filters.length)return true;
 // filterJoin:'or' => basta con cumplir UNO · por defecto 'and' => cumplir TODOS (compatible)
 return v.filterJoin==='or'
   ? v.filters.some(f=>passFilter(f,t))
   : v.filters.every(f=>passFilter(f,t));
}
function viewTasks(v){
 // Búsqueda global: ignora temporalmente el "smart" y los filtros de la vista
 const globalSearch=searchQ&&searchGlobal;
 let list=globalSearch
   ? liveTasks().slice()
   : liveTasks().filter(t=>smartMatch(v.smart,t)&&matchFilters(v,t));
 if(searchQ){const q=searchQ.toLowerCase();
  list=list.filter(t=>['name','desc','notes'].some(k=>String(t.v[k]||'').toLowerCase().includes(q)));}
 const sp=v.sort&&prop(v.sort.prop);
 if(sp){const dir=v.sort.dir||1;
  list.sort((a,b)=>{let x=propValue(a,sp),y=propValue(b,sp);
   if(Array.isArray(x))x=x.join();if(Array.isArray(y))y=y.join();
   const ex=x==null||x==='',ey=y==null||y==='';
   if(ex&&ey)return 0;if(ex)return 1;if(ey)return -1;
   if(sp.type==='number')return(+x-+y)*dir;
   return String(x).localeCompare(String(y),'es')*dir;});}
 return list;
}
</script>
<script>
'use strict';
/* ============================ POPOVER ============================ */
const pop=$('#pop');
let popCleanup=null;
function openPop(html,anchor,onOpen){
 pop.innerHTML=html;pop.classList.add('show');
 const r=anchor.getBoundingClientRect();
 pop.style.left='0px';pop.style.top='0px';
 const pw=pop.offsetWidth,ph=pop.offsetHeight;
 let x=Math.min(r.left,innerWidth-pw-8),y=r.bottom+4;
 if(y+ph>innerHeight-8)y=Math.max(8,r.top-ph-4);
 pop.style.left=Math.max(8,x)+'px';pop.style.top=y+'px';
 if(onOpen)onOpen(pop);
 setTimeout(()=>document.addEventListener('mousedown',popOut),0);
}
function popOut(e){if(!pop.contains(e.target))closePop();}
function closePop(){pop.classList.remove('show');pop.innerHTML='';document.removeEventListener('mousedown',popOut);if(popCleanup){popCleanup();popCleanup=null;}}

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600);}

/* ============================ RENDER RAÍZ ============================ */
function render(){renderTabs();renderToolbar();renderMain();if(openId)renderDrawer();if(section==='notes')renderNotes();}

let tempView=null;   // vista abierta desde «⋯ Más», visible sólo mientras se usa
function pinnedIds(){
 const all=D.views.filter(v=>!v.hidden).map(v=>v.id);
 return (D.settings.pinnedViews||[]).filter(id=>all.includes(id));
}
function renderTabs(){
 const nav=$('#tabs');nav.innerHTML='';
 let pins=pinnedIds();
 if(!pins.length)pins=[cur];                      // nunca dejar la barra vacía
 const mkTab=(v,opts)=>{
  opts=opts||{};
  const b=document.createElement('button');
  b.className='tab'+(v.id===cur?' on':'')+(opts.temp?' temp':'');
  b.draggable=!opts.temp;b.dataset.id=v.id;
  b.innerHTML=`<span>${esc(v.icon||'▦')}</span><span>${esc(v.name)}</span>`+
    (opts.temp?`<span class="closetab" data-closetab title="Cerrar">✕</span>`
              :`<span class="more" title="Opciones de vista">⋯</span>`);
  b.onclick=e=>{
   if(e.target.dataset.closetab!==undefined){tempView=null;cur=pinnedIds()[0]||D.views.find(x=>!x.hidden).id;render();return;}
   if(e.target.classList.contains('more')||cur===v.id){viewMenu(v,b);return;}
   cur=v.id;selIds&&selIds.clear&&selIds.clear();showN=200;render();
  };
  if(!opts.temp){
   b.ondragstart=e=>{e.dataTransfer.setData('view',v.id);e.dataTransfer.effectAllowed='move';};
   b.ondragover=e=>{if(e.dataTransfer.types.includes('view')){e.preventDefault();b.classList.add('dragover');}};
   b.ondragleave=()=>b.classList.remove('dragover');
   b.ondrop=e=>{e.preventDefault();b.classList.remove('dragover');
    const src=e.dataTransfer.getData('view');if(!src||src===v.id)return;
    const a=D.views.findIndex(x=>x.id===src),z=D.views.findIndex(x=>x.id===v.id);
    const[m]=D.views.splice(a,1);D.views.splice(z,0,m);m.updatedAt=nowISO();save();};
  }
  nav.appendChild(b);
 };
 pins.forEach(id=>{const v=view(id);if(v)mkTab(v);});
 // vista temporal (abierta desde el desplegable y no anclada)
 if(cur&&!pins.includes(cur)){const v=view(cur);if(v&&!v.hidden)mkTab(v,{temp:true});}
 // botón «⋯ Más» si hay vistas no ancladas
 const rest=D.views.filter(v=>!v.hidden&&!pins.includes(v.id)&&v.id!==cur);
 if(rest.length){
  const more=document.createElement('button');more.id='moreView';more.className='tab';
  more.innerHTML='<span>⋯</span><span>Más</span>';
  more.onclick=()=>moreViewMenu(more);
  nav.appendChild(more);
 }
 const add=document.createElement('button');add.id='addView';add.className='tab';add.textContent='+ Vista nueva';
 add.onclick=()=>newViewMenu(add);
 nav.appendChild(add);
}
function moreViewMenu(anchor){
 const pins=pinnedIds();
 const rest=D.views.filter(v=>!v.hidden&&!pins.includes(v.id));
 openPop(`<div class="mhead">Más vistas</div>
  ${rest.map(v=>`<div class="mi listrow" style="cursor:default">
     <span class="nm" data-openview="${v.id}" style="cursor:pointer;flex:1">${esc(v.icon||'▦')} ${esc(v.name)}</span>
     <button class="pinbtn" data-pinview="${v.id}" title="Anclar">📌</button></div>`).join('')
   ||'<div class="mi" style="cursor:default;color:var(--tx3)">No hay más vistas</div>'}`,
  anchor,pp=>{
   pp.querySelectorAll('[data-openview]').forEach(b=>b.onclick=()=>{
    tempView=b.dataset.openview;cur=b.dataset.openview;showN=200;closePop();render();});
   pp.querySelectorAll('[data-pinview]').forEach(b=>b.onclick=()=>{
    pinView(b.dataset.pinview);closePop();render();});
  });
}
function pinView(id){
 const p=D.settings.pinnedViews||(D.settings.pinnedViews=[]);
 if(!p.includes(id))p.push(id);
 if(tempView===id)tempView=null;
 D.settings.updatedAt=nowISO();save();
}
function unpinView(id){
 D.settings.pinnedViews=(D.settings.pinnedViews||[]).filter(x=>x!==id);
 D.settings.updatedAt=nowISO();
 if(cur===id)tempView=id;         // sigue visible como temporal mientras se use
 save();
}

function viewMenu(v,anchor){
 openPop(`
  <input class="minput" id="vmName" value="${esc(v.name)}">
  <div class="mhead">Tipo</div>
  ${['table|▦ Tabla','calendar|📅 Calendario','board|▥ Tablero'].map(s=>{const[k,n]=s.split('|');
    return`<button class="mi ${v.kind===k?'sel':''}" data-k="${k}"><span class="mic">${v.kind===k?'✓':''}</span>${n}</button>`;}).join('')}
  <div class="msep"></div>
  <button class="mi" data-a="${pinnedIds().includes(v.id)?'unpin':'pin'}"><span class="mic">📌</span>${pinnedIds().includes(v.id)?'Desanclar de la barra':'Anclar a la barra'}</button>
  <button class="mi" data-a="dup"><span class="mic">⧉</span>Duplicar vista</button>
  <button class="mi" data-a="hide"><span class="mic">◌</span>Ocultar vista</button>
  ${v.builtin?'':'<button class="mi" data-a="del" style="color:var(--err)"><span class="mic">🗑</span>Eliminar vista</button>'}
 `,anchor,p=>{
  const nm=p.querySelector('#vmName');
  nm.onchange=()=>{v.name=nm.value||v.name;v.updatedAt=nowISO();save();};
  nm.onkeydown=e=>{if(e.key==='Enter'){nm.blur();closePop();}};
  p.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{v.kind=b.dataset.k;v.updatedAt=nowISO();save();closePop();});
  p.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
   const a=b.dataset.a;
   if(a==='pin'){pinView(v.id);closePop();render();return;}
   if(a==='unpin'){unpinView(v.id);closePop();render();return;}
   if(a==='dup'){const c=JSON.parse(JSON.stringify(v));c.id=uid('v');c.name=v.name+' (copia)';c.builtin=0;c.updatedAt=nowISO();
     D.views.splice(D.views.indexOf(v)+1,0,c);cur=c.id;}
   if(a==='hide'){v.hidden=true;v.updatedAt=nowISO();if(cur===v.id)cur=D.views.find(x=>!x.hidden).id;}
   if(a==='del'){if(!confirm('¿Eliminar la vista "'+v.name+'"?'))return;
     D.views=D.views.filter(x=>x.id!==v.id);if(cur===v.id)cur=D.views.find(x=>!x.hidden).id;}
   save();closePop();});
 });
}
function newViewMenu(anchor){
 openPop(`
  <input class="minput" id="nvName" placeholder="Nombre de la vista">
  <div class="mhead">Tipo de vista</div>
  <button class="mi" data-k="table"><span class="mic">▦</span>Tabla</button>
  <button class="mi" data-k="calendar"><span class="mic">📅</span>Calendario</button>
  <button class="mi" data-k="board"><span class="mic">▥</span>Tablero</button>
 `,anchor,p=>{
  p.querySelector('#nvName').focus();
  p.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
   const name=p.querySelector('#nvName').value.trim()||'Vista nueva';
   const v={id:uid('v'),name,icon:'▦',kind:b.dataset.k,smart:null,builtin:0,filters:[],
     sort:{prop:'date',dir:1},group:b.dataset.k==='board'?'status':null,
     cols:['name','date','status','desc','prio'],updatedAt:nowISO()};
   D.views.push(v);cur=v.id;save();closePop();});
 });
}

/* ============================ TOOLBAR ============================ */
function renderToolbar(){
 const v=view(cur);if(!v)return;
 $('#pFilter').className='pill'+(v.filters.length?' on':'');
 $('#pFilter').innerHTML='☰ Filtro'+(v.filters.length?` · ${v.filters.length}`:'');
 const sp=v.sort&&prop(v.sort.prop);
 $('#pSort').className='pill'+(sp?' on':'');
 $('#pSort').innerHTML='↕ '+(sp?esc(sp.name)+(v.sort.dir<0?' ↓':' ↑'):'Orden');
 const gp=v.group&&prop(v.group);
 $('#pGroup').className='pill'+(gp?' on':'');
 $('#pGroup').innerHTML='▦ '+(gp?'Agrupar: '+esc(gp.name):'Agrupar');
 $('#pGroup').style.display=v.kind==='table'?'':'none';
 $('#pProps').style.display=v.kind==='calendar'?'none':'';
 const bb=$('#bulkbar');
 if(selIds.size){bb.classList.add('show');$('#bulkN').textContent=selIds.size+' seleccionadas';}
 else bb.classList.remove('show');
}

/* ============================ MAIN ============================ */
function renderMain(){
 const v=view(cur);const main=$('#main');
 if(!v){main.innerHTML='';return;}
 if(v.kind==='calendar')return renderCal(main,v);
 if(v.kind==='board')return renderBoard(main,v);
 renderTable(main,v);
}

/* ---------- visibilidad de propiedades en el panel de detalle ---------- */
/* Ojo abierto / ojo tachado (iconos propios: los emojis de "ojo cerrado" no
   existen de forma fiable en todas las plataformas). */
const EYE_ON='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.1 10.1 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2m-6.7-1.1a3 3 0 1 1-4.2-4.2"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
/* ¿esta tarea tiene datos en esta propiedad? Las calculadas (creado/editado/
   fórmula) siempre "tienen" valor, así que no cuentan: sólo se ven si el
   usuario las activa. */
function hasValue(t,p){
 if(['created','edited','formula','title'].includes(p.type))return false;
 const v=t.v[p.id];
 return Array.isArray(v)?v.length>0:(v!==undefined&&v!==null&&v!=='');
}
/* Interruptor global de la propiedad (lo que refleja el ojo del menú) */
function propOn(p){
 if(p.drawerShow===true)return true;
 if(p.drawerShow===false)return false;
 return (D.settings.defaultVisibleProps||['date','status','desc']).includes(p.id);
}
/* Se muestra si está activada O si esta tarea ya tiene datos ahí
   (nunca escondemos información que el usuario ya guardó). */
function propShown(t,p){return propOn(p)||hasValue(t,p);}
function drawerProps(t){return D.props.filter(p=>p.type!=='title'&&propShown(t,p));}

/* ---------- celda (lectura) ---------- */
/* ctx==='drawer' → las celdas de texto envuelven en varias líneas;
   en la tabla se mantienen en una sola línea con elipsis. */
function cellHTML(t,p,ctx){
 const v=propValue(t,p);
 switch(p.type){
  case'title':{
   const dn=isDone(t);
   return`<div class="cell tname" data-cell><span class="donechk ${dn?'on':''}" data-done title="Completar">${dn?'✓':''}</span><span class="txt">${esc(v)||'<span style="color:var(--tx3)">Sin título</span>'}</span><span class="spacer"></span><button class="openb" data-open>ABRIR</button></div>`;}
  case'status':case'select':{
   const o=optOf(p,v);
   return`<div class="cell" data-cell>${v?`<span class="tag ${p.type==='status'?'st':''}" style="background:${cvar(o?o.color:'gray')}">${esc(v)}</span>`:''}</div>`;}
  case'multi':{
   const arr=Array.isArray(v)?v:[];
   return`<div class="cell" data-cell>${arr.map(x=>{const o=optOf(p,x);return`<span class="tag" style="background:${cvar(o?o.color:hashColor(x))}">${esc(x)}</span>`;}).join('')}</div>`;}
  case'date':{
   const od=p.id==='date'&&isOverdue(t);
   return`<div class="cell ${od?'overdue':''}" data-cell>${esc(fmtDate(v))}</div>`;}
  case'checkbox':return`<div class="cell" data-cell>${v?'☑':'☐'}</div>`;
  case'url':return`<div class="cell" data-cell>${v?`<a href="${esc(/^https?:/.test(v)?v:'https://'+v)}" target="_blank" rel="noopener">${esc(v)}</a>`:''}</div>`;
  case'email':return`<div class="cell" data-cell>${v?`<a href="mailto:${esc(v)}">${esc(v)}</a>`:''}</div>`;
  case'phone':return`<div class="cell" data-cell>${v?`<a href="tel:${esc(v)}">${esc(v)}</a>`:''}</div>`;
  case'person':return`<div class="cell" data-cell>${v?'👤 '+esc(v):''}</div>`;
  case'noteref':{
   /* Filtramos aquí las notas que ya no existen. No las borramos del dato: una
      referencia "rota" puede ser sólo una nota que aún no ha llegado de otro
      dispositivo, y borrarla perdería el vínculo para siempre. */
   const live=(Array.isArray(v)?v:[]).map(id=>note(id)).filter(Boolean);
   return`<div class="cell noteref${ctx==='drawer'?' multi':''}" data-cell>${
    live.map(n=>`<span class="nchip" data-nchip="${n.id}">🗒 <span class="nctx">${esc(n.title)||'Sin título'}</span><button class="openb" data-nopen="${n.id}" title="Abrir nota">ABRIR</button></span>`).join('')
    ||'<span style="color:var(--tx3)">Vincular o crear nota…</span>'}</div>`;}
  case'created':case'edited':return`<div class="cell" style="color:var(--tx2)">${esc(fmtDT(v))}</div>`;
  case'formula':return`<div class="cell" style="color:var(--tx2)">${esc(v)}</div>`;
  default:return`<div class="cell${ctx==='drawer'&&p.type==='text'?' multi':''}" data-cell>${esc(v??'')}</div>`;
 }
}

/* ---------- editor de celda ---------- */
function editCell(el,t,p){
 if(['created','edited','formula'].includes(p.type))return;
 if(p.type==='checkbox'){setVal(t,p.id,!t.v[p.id]);return;}
 if(p.type==='status'||p.type==='select')return optionMenu(el,t,p,false);
 if(p.type==='multi')return optionMenu(el,t,p,true);
 if(p.type==='date')return dateMenu(el,t,p);
 if(p.type==='noteref')return noteMenu(el,t,p);
 // texto / número / url / email / phone / person / title
 const old=t.v[p.id]??'';
 const multi=p.type==='text';   // descripciones y notas: multilínea
 el.classList.add('editing');
 el.innerHTML=multi?`<textarea rows="1">${esc(old)}</textarea>`
                   :`<input type="${p.type==='number'?'number':'text'}" value="${esc(old)}">`;
 const inp=el.querySelector(multi?'textarea':'input');
 /* Cursor AL FINAL en vez de seleccionar todo el texto (al teclear en el móvil,
    la selección completa borraba lo que ya había). setSelectionRange lanza
    InvalidStateError en type="number", de ahí el try/catch. */
 inp.focus();
 try{const L=inp.value.length;inp.setSelectionRange(L,L);}catch(_){}
 /* La caja crece una línea a la vez y nunca hace scroll interno ni lateral */
 const grow=()=>{inp.style.height='auto';inp.style.height=(inp.scrollHeight||34)+'px';};
 if(multi){grow();inp.oninput=grow;}
 let done=false;
 const commit=ok=>{if(done)return;done=true;
  if(ok&&inp.value!==String(old))setVal(t,p.id,p.type==='number'?(inp.value===''?'':+inp.value):inp.value);
  else render();};
 inp.onblur=()=>commit(true);
 inp.onkeydown=e=>{
  /* Escape cancela SÓLO la edición: sin esto el evento sube al manejador
     global y además cierra el panel de la tarea. */
  if(e.key==='Escape'){e.stopPropagation();commit(false);return;}
  if(e.key==='Enter'){
   if(!multi){commit(true);return;}                        // una línea: Enter guarda
   if(e.ctrlKey||e.metaKey){e.preventDefault();commit(true);} // multilínea: Ctrl/Cmd+Enter guarda
   /* Enter a secas: salto de línea */
  }};
}
function optionMenu(anchor,t,p,multi){
 const selv=multi?(t.v[p.id]||[]):t.v[p.id];
 const opts=(p.options||[]);
 openPop(`
  <input class="minput" id="omQ" placeholder="Buscar o crear…">
  <div id="omList">${opts.map(o=>{
    const on=multi?selv.includes(o.name):selv===o.name;
    const u=optionUsage(p,o.name);
    return`<div class="mi listrow" style="cursor:default">
      <span class="nm" data-o="${esc(o.name)}" style="cursor:pointer;flex:1;display:flex;align-items:center;gap:6px"><span class="mic">${on?'✓':''}</span><span class="tag ${p.type==='status'?'st':''}" style="background:${cvar(o.color)}">${esc(o.name)}</span></span>
      <button class="xopt" data-optdel="${esc(o.name)}" ${u.total?'disabled title="'+esc(usageReason(u))+'"':'title="Eliminar opción"'}>✕</button>
    </div>`;}).join('')}</div>
  ${!multi&&selv?'<div class="msep"></div><button class="mi" data-clear><span class="mic">✕</span>Quitar valor</button>':''}
 `,anchor,pp=>{
  const q=pp.querySelector('#omQ');q.focus();
  const apply=name=>{
   ensureOption(p,name);
   if(multi){const arr=[...(t.v[p.id]||[])];const i=arr.indexOf(name);
    i>=0?arr.splice(i,1):arr.push(name);
    if(arr.length)t.v[p.id]=arr;else delete t.v[p.id];
    touch(t);M.pending++;scheduleSync();persist();syncUI();
    popCleanup=()=>render();
    closePop();optionMenu(anchor,t,p,multi);}   // reabrir para conservar el layout con ✕
   else{setVal(t,p.id,name);closePop();}
  };
  pp.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>apply(b.dataset.o));
  pp.querySelectorAll('[data-optdel]').forEach(btn=>{if(btn.disabled)return;
   btn.onclick=e=>{e.stopPropagation();deleteOption(p,btn.dataset.optdel);closePop();optionMenu(anchor,t,p,multi);};});
  const clr=pp.querySelector('[data-clear]');if(clr)clr.onclick=()=>{setVal(t,p.id,'');closePop();};
  q.oninput=()=>{const s=q.value.toLowerCase();
   pp.querySelectorAll('.listrow').forEach(row=>{const nm=row.querySelector('[data-o]');if(nm)row.style.display=nm.dataset.o.toLowerCase().includes(s)?'':'none';});};
  q.onkeydown=e=>{if(e.key==='Enter'&&q.value.trim())apply(q.value.trim());};
 });
}
function dateMenu(anchor,t,p){
 const cv=t.v[p.id]||'';const d=dOnly(cv);const tm=cv.length>10?cv.slice(11,16):'';
 openPop(`
  <div class="mhead">Fecha</div>
  <input class="minput" type="date" id="dmD" value="${d}">
  <input class="minput" type="time" id="dmT" value="${tm}">
  <button class="mi" data-q="0"><span class="mic">☀</span>Hoy</button>
  <button class="mi" data-q="1"><span class="mic">→</span>Mañana</button>
  <button class="mi" data-q="7"><span class="mic">▤</span>En una semana</button>
  <div class="msep"></div>

/* ---------- Áreas de las notas ----------
   Las notas comparten la MISMA lista de opciones que la propiedad «Area» de las
   tareas: crear un área desde una nota la deja disponible también en las tareas.
   note.area guarda el nombre (o va ausente = «Sin área»). */
const NO_AREA='Sin área';
function areaProp(){return D.props.find(p=>p.id==='area');}
function areaOptions(){const p=areaProp();return p&&p.options?p.options.map(o=>o.name):[];}
function noteArea(n){return (n&&n.area)?n.area:NO_AREA;}
function ensureAreaProp(){
 /* El usuario puede haber borrado la propiedad; la recreamos de forma perezosa
    la primera vez que una nota necesita un área (no en cada arranque, para no
    resucitar algo que se borró a propósito). */
 let p=areaProp();
 if(!p){p={id:'area',name:'Area',type:'select',options:[],hidden:true,updatedAt:nowISO()};D.props.push(p);}
 return p;
}
function setNoteArea(n,name){
 if(name){ensureOption(ensureAreaProp(),name);n.area=name;}
 else delete n.area;
 n.updatedAt=nowISO();save();
}
function areaMenu(anchor,n){
 const opts=areaOptions();
 openPop(`<input class="minput" id="amQ" placeholder="Buscar o crear área…">
  <div id="amList">
   ${opts.map(o=>`<button class="mi" data-area="${esc(o)}"><span class="mic">${noteArea(n)===o?'✓':''}</span>${esc(o)}</button>`).join('')}
  </div>
  ${n.area?'<div class="msep"></div><button class="mi" data-area-clear><span class="mic">✕</span>Quitar área</button>':''}`,
  anchor,pp=>{
   const q=pp.querySelector('#amQ');q.focus();
   pp.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{setNoteArea(n,b.dataset.area);closePop();renderNotes();});
   const clr=pp.querySelector('[data-area-clear]');if(clr)clr.onclick=()=>{setNoteArea(n,'');closePop();renderNotes();};
   q.oninput=()=>{const s=q.value.toLowerCase();
    pp.querySelectorAll('[data-area]').forEach(b=>b.style.display=b.dataset.area.toLowerCase().includes(s)?'':'none');};
   q.onkeydown=e=>{if(e.key==='Enter'&&q.value.trim()){setNoteArea(n,q.value.trim());closePop();renderNotes();}};
  });
}

function renderTable(main,v){
 const list=viewTasks(v);
 const cols=v.cols.map(prop).filter(p=>p&&!p.hiddenGlobal);
 let html='<table class="grid"><thead><tr><th class="selcol"><input type="checkbox" id="selAll"></th>';
 cols.forEach(p=>{html+=`<th data-col="${p.id}" draggable="true"><div class="th-in"><span style="color:var(--tx3)">${TYPES[p.type].ic}</span>${esc(p.name)}${v.sort&&v.sort.prop===p.id?(v.sort.dir<0?' ↓':' ↑'):''}</div></th>`;});
 html+=`<th style="width:40px"><div class="th-in" id="thAdd" title="Agregar propiedad">＋</div></th></tr></thead><tbody>`;

 const gp=v.group&&prop(v.group);
 const rows=(arr)=>arr.slice(0,showN).map(t=>{
  const cells=cols.map(p=>`<td data-t="${t.id}" data-p="${p.id}">${cellHTML(t,p)}</td>`).join('');
  return`<tr class="trow ${isDone(t)?'done':''} ${selIds.has(t.id)?'sel':''}" data-t="${t.id}">
    <td class="selcol"><input type="checkbox" data-sel="${t.id}" ${selIds.has(t.id)?'checked':''}></td>${cells}<td></td></tr>`;
 }).join('');

 if(gp){
  const groups=new Map();
  list.forEach(t=>{let k=propValue(t,gp);
   if(gp.type==='date')k=dOnly(k)?(dOnly(k)<todayStr()?'⚠ Vencidas':fmtDate(dOnly(k))):'Sin fecha';
   if(Array.isArray(k))k=k.join(', ');k=k||'Sin '+gp.name;
   if(!groups.has(k))groups.set(k,[]);groups.get(k).push(t);});
  let keys=[...groups.keys()];
  if(gp.options)keys.sort((a,b)=>{const ia=gp.options.findIndex(o=>o.name===a),ib=gp.options.findIndex(o=>o.name===b);
   return(ia<0?99:ia)-(ib<0?99:ib);});
  keys.forEach(k=>{
   const open=!collapsed.has(k);
   html+=`<tr class="grp" data-g="${esc(k)}"><td colspan="${cols.length+2}">${open?'▾':'▸'} ${esc(k)} <span style="color:var(--tx3);font-weight:400">· ${groups.get(k).length}</span></td></tr>`;
   if(open)html+=rows(groups.get(k));
  });
 }else html+=rows(list);

 html+=`<tr class="newrow"><td colspan="${cols.length+2}" id="rowNew">＋ Nueva tarea</td></tr></tbody></table>`;
 if(list.length>showN)html+=`<button class="btn" id="morebtn">Mostrar más (${list.length-showN} restantes)</button>`;
 if(!list.length)html+=`<div class="empty"><b>Sin tareas aquí</b>Crea una con «＋ Nueva tarea», o desde el calendario.</div>`;
 main.innerHTML=html;

 /* eventos */
 const selAll=$('#selAll');
 if(selAll){selAll.checked=list.length&&list.every(t=>selIds.has(t.id));
  selAll.onchange=()=>{list.forEach(t=>selAll.checked?selIds.add(t.id):selIds.delete(t.id));render();};}
 main.querySelectorAll('[data-sel]').forEach(c=>c.onchange=()=>{c.checked?selIds.add(c.dataset.sel):selIds.delete(c.dataset.sel);renderToolbar();
  main.querySelector(`tr[data-t="${c.dataset.sel}"]`)?.classList.toggle('sel',c.checked);});
 main.querySelectorAll('td[data-p]').forEach(td=>{
  td.onclick=e=>{
   const t=task(td.dataset.t),p=prop(td.dataset.p);if(!t||!p)return;
   if(e.target.closest('[data-open]')){openDrawer(t.id);return;}
   if(e.target.closest('[data-done]')){toggleDone(t);return;}
   const nop=e.target.closest('[data-nopen]');
   if(nop){openNotes(nop.dataset.nopen);return;}
   if(e.target.tagName==='A')return;
   const c=td.querySelector('[data-cell]');if(c)editCell(c,t,p);
  };});
 main.querySelectorAll('.grp').forEach(g=>g.onclick=()=>{const k=g.dataset.g;
  collapsed.has(k)?collapsed.delete(k):collapsed.add(k);render();});
 const rn=$('#rowNew');if(rn)rn.onclick=()=>quickNew(v);
 const mb=$('#morebtn');if(mb)mb.onclick=()=>{showN+=300;render();};
 const ta=$('#thAdd');if(ta)ta.onclick=()=>addPropMenu(ta,v);
 /* orden por columna + arrastrar columnas */
 main.querySelectorAll('th[data-col]').forEach(th=>{
  th.querySelector('.th-in').onclick=()=>{
   const id=th.dataset.col;
   if(v.sort&&v.sort.prop===id)v.sort.dir=-(v.sort.dir||1);else v.sort={prop:id,dir:1};
   v.updatedAt=nowISO();save();};
  th.oncontextmenu=e=>{e.preventDefault();colMenu(th,v,th.dataset.col);};
  th.ondragstart=e=>e.dataTransfer.setData('col',th.dataset.col);
  th.ondragover=e=>{if(e.dataTransfer.types.includes('col')){e.preventDefault();th.classList.add('dragover');}};
  th.ondragleave=()=>th.classList.remove('dragover');
  th.ondrop=e=>{e.preventDefault();th.classList.remove('dragover');
   const src=e.dataTransfer.getData('col');if(!src||src===th.dataset.col)return;
   const a=v.cols.indexOf(src),b=v.cols.indexOf(th.dataset.col);
   v.cols.splice(a,1);v.cols.splice(b,0,src);v.updatedAt=nowISO();save();};
 });
}

/* ---------- CALENDARIO ---------- */
/* Abre el MISMO drawer de creación que el resto de vistas, con la fecha ya puesta */
function calNewTask(date){
 const t=newTask(date?{date}:{});
 save();openDrawer(t.id);

function renderCal(main,v){
 if(!calMonth)calMonth=todayStr().slice(0,7);
 const[y,m]=calMonth.split('-').map(Number);
 const first=new Date(y,m-1,1);
 const start=new Date(first);start.setDate(1-((first.getDay()+6)%7)); // lunes
 const tasksByDay={};
 liveTasks().filter(t=>matchFilters(v,t)).forEach(t=>{
  const d=dOnly(t.v.date);if(!d)return;(tasksByDay[d]=tasksByDay[d]||[]).push(t);});
 const monthName=first.toLocaleDateString('es',{month:'long',year:'numeric'});
 let html=`<div id="cal"><div class="cal-head">
   <h2>${esc(monthName)}</h2><div class="spacer"></div>
   <button class="btn" id="calPrev">‹</button><button class="btn" id="calToday">Hoy</button><button class="btn" id="calNext">›</button>
  </div><div class="cal-grid">`;
 ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(d=>html+=`<div class="cal-dow">${d}</div>`);
 const T=todayStr();
 for(let i=0;i<42;i++){
  const d=new Date(start);d.setDate(start.getDate()+i);
  const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const out=d.getMonth()!==m-1;
  const dayTasks=(tasksByDay[ds]||[]);
  const exp=renderCal._exp===ds;
  const shown=exp?dayTasks:dayTasks.slice(0,4);
  html+=`<div class="cal-day ${out?'out':''} ${ds===T?'today':''}" data-day="${ds}">
   <span class="dnum">${d.getDate()}</span>
   ${shown.map(t=>{const st=optOf(statusProp(),t.v.status);
     return`<div class="chip ${isOverdue(t)?'od':''} ${isDone(t)?'dn':''}" draggable="true" data-chip="${t.id}" title="${esc(t.v.name)}"><span class="cdot" style="background:${cvar(st?st.color:'gray')}"></span>${esc(t.v.name)||'Sin título'}</div>`;}).join('')}
   ${dayTasks.length>4&&!exp?`<button class="chip" data-more="${ds}" style="cursor:pointer;color:var(--tx2)">+${dayTasks.length-4} más</button>`:''}
   <button class="qadd" data-q="${ds}" title="Nueva tarea este día">＋ tarea</button>
  </div>`;
 }
 html+='</div></div>';
 main.innerHTML=html;
 $('#calPrev').onclick=()=>{calMonth=addDays(calMonth+'-15',-30).slice(0,7);render();};
 $('#calNext').onclick=()=>{calMonth=addDays(calMonth+'-15',30).slice(0,7);render();};
 $('#calToday').onclick=()=>{calMonth=todayStr().slice(0,7);render();};
 main.querySelectorAll('[data-chip]').forEach(c=>{
  c.onclick=()=>openDrawer(c.dataset.chip);
  c.ondragstart=e=>e.dataTransfer.setData('task',c.dataset.chip);
 });
 main.querySelectorAll('[data-more]').forEach(b=>b.onclick=e=>{e.stopPropagation();renderCal._exp=b.dataset.more;render();});
 main.querySelectorAll('.cal-day').forEach(cd=>{
  cd.ondragover=e=>{if(e.dataTransfer.types.includes('task')){e.preventDefault();cd.classList.add('dragover');}};
  cd.ondragleave=()=>cd.classList.remove('dragover');

/* ============================ BLOQUES / ELEMENTOS ============================
   Motor compartido. No sabe qué es su dueño: le basta un objeto con .blocks y
   un updatedAt (tareas ahora; notas en la fase 7). Los bloques viven DENTRO de
   su dueño, así que viajan con él en la sincronización sin trabajo extra. */
const BLOCK_TYPES={md:{n:'Texto (Markdown)',ic:'≡'},table:{n:'Tabla',ic:'▦'},db:{n:'Base de datos',ic:'🗄'},todo:{n:'To-do list',ic:'☑'}};
/* Qué elementos ofrece cada dueño: las tareas sólo los 3 pedidos; las notas
   añaden Markdown (fase 7). */
const TASK_BLOCKS=['table','db','todo'];
const DB_TYPES={text:'Texto',number:'Número',select:'Selección',checkbox:'Casilla',date:'Fecha'};
const DB_TYPE_IC={text:'Aa',number:'#',select:'▾',checkbox:'☑',date:'📅'};

const blocksOf=o=>(o.blocks=o.blocks||[]);
function newBlock(type){
 const b={id:uid('b'),type,title:'',updatedAt:nowISO()};
 if(type==='md')b.text='';
 if(type==='table')Object.assign(b,{cols:[{id:uid('c'),name:'Columna 1'},{id:uid('c'),name:'Columna 2'}],rows:[]});
 if(type==='db')Object.assign(b,{props:[{id:uid('dp'),name:'Nombre',type:'text'},{id:uid('dp'),name:'Estado',type:'select',options:[]}],rows:[]});
 if(type==='todo')Object.assign(b,{items:[]});
 return b;
}
/* Cambio estructural (añadir/borrar fila, columna, bloque…) → repinta.
   Cambio de contenido de una celda → guarda SIN repintar, para no arrancarle
   el foco al usuario mientras escribe. */
function blkChanged(owner,b,redraw){
 if(b)b.updatedAt=nowISO();
 owner.updatedAt=nowISO();
 save(redraw?undefined:{noRender:true});
}
function blockMenu(anchor,owner,types){
 const allow=types||TASK_BLOCKS;
 openPop(`<div class="mhead">Añadir elemento</div>
  ${allow.map(k=>{const v=BLOCK_TYPES[k];
   return `<button class="mi" data-blk="${k}"><span class="mic">${v.ic}</span>${v.n}</button>`;}).join('')}`,
  anchor,pp=>pp.querySelectorAll('[data-blk]').forEach(b=>b.onclick=()=>{
   blocksOf(owner).push(newBlock(b.dataset.blk));
   blkChanged(owner,null,true);closePop();}));
}
/* Estado efímero de orden/búsqueda por bloque. Vive FUERA de renderBlocks para
   sobrevivir a los repintados. Nunca se guarda ni se sincroniza: es sólo visual.
   { sort:{col,dir}, q:'' } por id de bloque. */
const blkUI=new Map();
function blkState(id){if(!blkUI.has(id))blkUI.set(id,{sort:null,q:''});return blkUI.get(id);}
/* Comparación tipada; los vacíos van al final en ambos sentidos. */
function blkCompare(va,vb,type,dir){
 const ea=va===''||va==null,eb=vb===''||vb==null;
 if(ea&&eb)return 0;if(ea)return 1;if(eb)return -1;   // vacíos siempre al final
 let r;
 if(type==='number')r=(+va)-(+vb);
 else if(type==='checkbox')r=(va?1:0)-(vb?1:0);
 else if(type==='date')r=String(va).localeCompare(String(vb));
 else r=String(va).localeCompare(String(vb),undefined,{numeric:true});
 return dir<0?-r:r;
}
/* Devuelve las filas en el orden a MOSTRAR sin tocar el array original. */
function blkViewRows(rows,getVal,st){
 let view=rows.map((r,i)=>({r,i}));
 if(st.q){const q=st.q.toLowerCase();
  view=view.filter(({r})=>getVal(r,'__all__').toLowerCase().includes(q));}
 if(st.sort){const{col,dir,type}=st.sort;
  view=view.slice().sort((A,B)=>blkCompare(getVal(A.r,col),getVal(B.r,col),type,dir)|| (A.i-B.i));}
 return view.map(x=>x.r);
}
/* ---------- Copiar elementos al portapapeles ----------
   Escribe dos representaciones a la vez: text/html (una <table> para
   tablas/BD, que Sheets y Excel leen como celdas) y text/plain (TSV o el
   markdown/lista crudo). Todo valor de celda se escapa: copiar es una
   salida, así que el contenido del usuario es texto no confiable. */
async function copyToClipboard(html,text){
 try{
  if(navigator.clipboard&&window.ClipboardItem){
   await navigator.clipboard.write([new ClipboardItem({
    'text/html':new Blob([html],{type:'text/html'}),
    'text/plain':new Blob([text],{type:'text/plain'})})]);
  }else if(navigator.clipboard&&navigator.clipboard.writeText){
   await navigator.clipboard.writeText(text);
  }else{
   const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
   document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);
  }
  toast('Copiado');
 }catch(err){toast('No se pudo copiar');}
}
const dbCellText=(b,r,p)=>{
 const v=r.v[p.id];
 if(p.type==='checkbox')return v?'✓':'✗';
 if(v==null||v==='')return'';
 return String(v);
};
function blockToClipboard(b){
 if(b.type==='table'){
  const head=b.cols.map(c=>c.name);
  const rows=b.rows.map(r=>b.cols.map(c=>r.cells[c.id]||''));
  const grid=[head,...rows];
  const html='<table>'+grid.map((row,i)=>'<tr>'+row.map(cell=>`<${i?'td':'th'}>${esc(cell)}</${i?'td':'th'}>`).join('')+'</tr>').join('')+'</table>';
  const text=grid.map(row=>row.join('\t')).join('\n');
  return{html,text};
 }
 if(b.type==='db'){
  const head=b.props.map(p=>p.name);
  const rows=b.rows.map(r=>b.props.map(p=>dbCellText(b,r,p)));
  const grid=[head,...rows];
  const html='<table>'+grid.map((row,i)=>'<tr>'+row.map(cell=>`<${i?'td':'th'}>${esc(cell)}</${i?'td':'th'}>`).join('')+'</tr>').join('')+'</table>';
  const text=grid.map(row=>row.join('\t')).join('\n');
  return{html,text};
 }
 if(b.type==='todo'){
  const text=b.items.map(it=>`- [${it.done?'x':' '}] ${it.text||''}`).join('\n');
  return{html:'<pre>'+esc(text)+'</pre>',text};
 }
 // md (u otros): markdown crudo
 const text=b.text||'';
 return{html:'<pre>'+esc(text)+'</pre>',text};
}
function copyBlock(b){const{html,text}=blockToClipboard(b);copyToClipboard(html,text);}

function blkTopControls(b){

/* Cicla asc → desc → sin orden y repinta sólo el cuerpo del bloque. */
function cycleSort(b,col,type,box,redraw){
 const st=blkState(b.id);
 if(!st.sort||st.sort.col!==col)st.sort={col,dir:1,type};
 else if(st.sort.dir>0)st.sort.dir=-1;
 else st.sort=null;
 redraw();
}

/* ---------- To-do list (flujo de escritura estilo Google Keep) ---------- */
function focusTodo(id,toEnd){
 /* render() es síncrono, así que tras repintar el input ya existe y podemos
    devolverle el foco sin timeouts. Null-safe: el bloque puede haberse
    repintado dentro de una sección que ahora no está visible. */
 const el=document.querySelector(`[data-todotxt="${id}"]`);
 if(!el)return;
 el.focus();
 try{const L=el.value.length;el.setSelectionRange(toEnd===false?0:L,toEnd===false?0:L);}catch(_){}
}
function renderTodoBlock(box,b,owner){
